name: Post stable release changelog to Telegram

# Fires when a full (non-pre-release) release is published, and when an existing
# pre-release is promoted to a full release — which is how this project ships
# stable versions: the beta channel is pre-releases, one of which is later marked
# Latest. GitHub emits `released` for that promotion, never `published`, so the
# workflow used to listen to `published` alone and stayed silent every time.
#
# Creating a stable release outright emits BOTH events. The concurrency group
# collapses that pair: keyed on the tag, the second run cancels the first before
# it reaches Telegram, since a queued run cancels the in-progress one long before
# a runner has finished starting. Residual race, if a runner is unusually fast:
# one duplicate message. That is the right side to fail on — the failure it
# replaces is announcing nothing at all.
#
# Flow: reopen topic → send formatted changelog → pin → close topic.
on:
  release:
    types: [published, released]

concurrency:
  group: tg-stable-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  telegram-stable:
    runs-on: ubuntu-latest
    # Extra guard: ignore accidental triggers on pre-releases.
    # telegram-changelog.yml handles those, and its guard is the exact mirror of
    # this one, so exactly one of the two workflows ever posts.
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Send changelog to Telegram (reopen → post → pin → close)
        env:
          TG_TOKEN:    ${{ secrets.TG_CHANGELOG_BOT_TOKEN }}
          TG_CHAT_ID:  ${{ secrets.TG_CHANGELOG_CHAT_ID }}
          TG_THREAD:   ${{ secrets.TG_STABLE_THREAD_ID }}
          RELEASE_TAG:  ${{ github.event.release.tag_name }}
          RELEASE_URL:  ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 << 'EOF'
          import os, re, json, urllib.request, urllib.error, sys

          token    = os.environ['TG_TOKEN']
          chat_id  = os.environ['TG_CHAT_ID']
          thread   = os.environ['TG_THREAD'].strip()
          tag      = os.environ['RELEASE_TAG']
          url      = os.environ['RELEASE_URL']
          body     = os.environ['RELEASE_BODY']

          # ── Helpers ────────────────────────────────────────────────────────

          def html_esc(s):
              return s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          def inline_html(text):
              pattern = re.compile(
                  r'(\*\*(.+?)\*\*'
                  r'|`(.+?)`'
                  r'|\[([^\]]+)\]\((https?://[^\)]+)\))',
                  re.DOTALL
              )
              result, last = '', 0
              for m in pattern.finditer(text):
                  result += html_esc(text[last:m.start()])
                  full = m.group(0)
                  if full.startswith('**'):
                      result += f'<b>{html_esc(m.group(2))}</b>'
                  elif full.startswith('`'):
                      result += f'<code>{html_esc(m.group(3))}</code>'
                  else:
                      result += f'<a href="{m.group(5)}">{html_esc(m.group(4))}</a>'
                  last = m.end()
              return result + html_esc(text[last:])

          def md_to_html(text):
              out = []
              for line in text.split('\n'):
                  h = re.match(r'^#{1,4}\s+(.*)', line)
                  if h:
                      out.append(f'<b>{inline_html(h.group(1))}</b>')
                      continue
                  if re.match(r'^-{3,}\s*$', line.strip()):
                      out.append('')
                      continue
                  li = re.match(r'^[\-\*]\s+(.*)', line)
                  if li:
                      out.append(f'• {inline_html(li.group(1))}')
                      continue
                  out.append(inline_html(line))
              return re.sub(r'\n{3,}', '\n\n', '\n'.join(out)).strip()

          # ── Build message ──────────────────────────────────────────────────

          header    = f'🎉 <b>DashCast {html_esc(tag)}</b> — nouvelle version stable\n\n'
          footer    = f'\n\n<a href="{url}">→ Changelog complet &amp; téléchargement</a>'
          body_html = md_to_html(body)

          max_body = 4096 - len(header) - len(footer) - 10
          if len(body_html) > max_body:
              body_html = body_html[:max_body].rsplit('\n', 1)[0] + '\n[…]'

          message = header + body_html + footer

          # ── Bot API ────────────────────────────────────────────────────────

          def tg(method, payload):
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f'[{method}] HTTP {e.code}: {e.read().decode()}', file=sys.stderr)
                  raise

          # 1. Reopen
          res = tg('reopenForumTopic', {'chat_id': chat_id, 'message_thread_id': int(thread)})
          print(f'reopen: {res.get("ok")}')

          # 2. Send
          payload = {
              'chat_id':                  chat_id,
              'text':                     message,
              'parse_mode':               'HTML',
              'disable_web_page_preview': True,
              'disable_notification':     False,
          }
          if thread:
              payload['message_thread_id'] = int(thread)

          sent   = tg('sendMessage', payload)
          msg_id = sent['result']['message_id']
          print(f'sent: message_id={msg_id}')

          # 3. Pin
          pin = tg('pinChatMessage', {
              'chat_id':              chat_id,
              'message_id':           msg_id,
              'disable_notification': True,
          })
          print(f'pinned: {pin.get("ok")}')

          # 4. Close
          res = tg('closeForumTopic', {'chat_id': chat_id, 'message_thread_id': int(thread)})
          print(f'closed: {res.get("ok")}')

          EOF
