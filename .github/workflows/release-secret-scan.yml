name: Scan published release assets for secrets

# Fires on every published release and inspects the APK that is ACTUALLY downloadable,
# not the source it was supposedly built from. That distinction is the whole point: for
# every release since versionCode 441 the attached asset carried a live Telegram bot
# token in its DEX (audit AUD-001), and nothing connected the intent to the artefact.
#
# It ALERTS, it never blocks. At roughly one beta per day a gate in the maintainer's
# hottest path would be removed within a week, and a false positive at 23:00 would also
# stop the changelog job that testers rely on as their distribution signal. Failing the
# job would achieve nothing except a red cross nobody can act on at that hour.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download every asset of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" --dir assets --pattern '*.apk' --clobber || true
          ls -la assets/ || true

      - name: Scan the DEX and resources for credential patterns
        id: scan
        run: |
          python3 << 'EOF'
          import glob, os, re, subprocess, sys, zipfile

          # Capability patterns: shapes that grant access if leaked. Kept deliberately narrow —
          # a scanner that cries wolf is a scanner that gets deleted.
          PATTERNS = {
              "telegram bot token": re.compile(rb"[0-9]{8,12}:AA[A-Za-z0-9_-]{30,}"),
              "azure SAS signature": re.compile(rb"sig=[A-Za-z0-9%+/=]{40,}"),
              "openai key":          re.compile(rb"sk-[A-Za-z0-9]{32,}"),
              "github token":        re.compile(rb"gh[pousr]_[A-Za-z0-9]{30,}"),
              "aws access key":      re.compile(rb"AKIA[0-9A-Z]{16}"),
              "slack token":         re.compile(rb"xox[abprs]-[A-Za-z0-9-]{10,}"),
          }

          findings = []
          apks = sorted(glob.glob("assets/*.apk"))
          if not apks:
              print("no APK asset on this release — nothing to scan")
              sys.exit(0)

          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  names = [n for n in z.namelist()
                           if n.endswith(".dex") or n == "resources.arsc" or n.startswith("assets/")]
                  for n in names:
                      try:
                          blob = z.read(n)
                      except Exception:
                          continue
                      for label, rx in PATTERNS.items():
                          if rx.search(blob):
                              findings.append(f"{os.path.basename(apk)} :: {n} :: {label}")

              # A debuggable manifest is its own hazard: it exposes run-as on a platform-signed app.
              #
              # This used to search the binary manifest for the ASCII bytes b"debuggable" and could
              # never fire. Android's binary XML keeps its string pool in UTF-16LE, so the ASCII
              # form is simply not in the file. Measured on real artefacts of this project rather
              # than assumed: a DEBUG apk — genuinely debuggable — contains the UTF-16LE form and
              # not the ASCII one; a release apk contains neither, because AGP omits the attribute
              # entirely when it is false. So the UTF-16LE presence is the signal, and its absence
              # in release is what makes the check meaningful rather than noisy.
              try:
                  out = subprocess.run(["unzip", "-p", apk, "AndroidManifest.xml"],
                                       capture_output=True).stdout
                  needles = [b"debuggable", "debuggable".encode("utf-16-le")]
                  if any(n in out for n in needles):
                      findings.append(f"{os.path.basename(apk)} :: manifest :: possibly debuggable")
              except Exception:
                  pass

          # Deduplicate: one line per (asset, kind) is enough to act on.
          findings = sorted(set(findings))
          for f in findings:
              print("FOUND:", f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("count=%d\n" % len(findings))
              fh.write("report<<EOR\n" + ("\n".join(findings) if findings else "") + "\nEOR\n")
          EOF

      - name: Alert in the Telegram topic when something was found
        if: ${{ steps.scan.outputs.count != '0' }}
        env:
          TG_TOKEN:   ${{ secrets.TG_CHANGELOG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHANGELOG_CHAT_ID }}
          TG_THREAD:  ${{ secrets.TG_CHANGELOG_THREAD_ID }}
          TAG:        ${{ github.event.release.tag_name }}
          REPORT:     ${{ steps.scan.outputs.report }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN", "")
          chat  = os.environ.get("TG_CHAT_ID", "")
          if not token or not chat:
              print("no Telegram credentials in CI — printing to the log instead")
              print(os.environ.get("REPORT", ""))
              raise SystemExit(0)

          text = ("⚠️ Secret scan flagged the published assets of "
                  + os.environ["TAG"] + "\n\n" + os.environ.get("REPORT", "")
                  + "\n\nThe release was NOT blocked. Check before telling testers to install it.")
          data = {"chat_id": chat, "text": text}
          thread = os.environ.get("TG_THREAD", "")
          if thread:
              data["message_thread_id"] = int(thread)
          req = urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % token,
              data=json.dumps(data).encode(),
              headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=20).read()
              print("alert posted")
          except Exception as e:
              # Never fail the job on a notification problem: the finding is already in the log.
              print("could not post the alert:", type(e).__name__)
          EOF

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.scan.outputs.count }}" = "0" ]; then
            echo "No credential pattern found in the published assets." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Secret scan findings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.scan.outputs.report }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
