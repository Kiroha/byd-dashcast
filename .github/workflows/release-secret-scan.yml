name: Scan published release assets for secrets

# Fires on every published release and inspects the APK that is ACTUALLY downloadable,
# not the source it was supposedly built from. That distinction is the whole point: for
# every release since versionCode 441 the attached asset carried a live Telegram bot
# token in its DEX (audit AUD-001), and nothing connected the intent to the artefact.
#
# A finding quarantines the release by returning it to draft and fails the workflow. The
# Telegram release workflow runs the same scanner before announcing an asset, so testers
# are never directed to a debuggable or credential-bearing APK.
on:
  release:
    types: [published, edited, released]
  schedule:
    # GitHub Actions exposes no release_asset trigger. Rescan the two OTA candidates hourly so an
    # asset replaced after publication cannot remain silently trusted.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release tag is untrusted input: its tree must never provide code to a job that can
          # draft releases or later receives notification secrets. The default branch owns policy.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download every asset of this release
        # Every ${{ }} value is bound to env and read as a shell variable, never pasted into the
        # script text. A tag name is attacker-influenced in the general case (anyone who can push a
        # tag chooses it), and expression interpolation happens BEFORE the shell sees the line, so
        # a crafted tag would be substituted as script rather than as an argument. The Telegram
        # step below already does it this way; these two were the ones that did not.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ github.event.release.tag_name }}
          REPO:     ${{ github.repository }}
        run: |
          mkdir -p assets
          gh release download "$TAG" \
            --repo "$REPO" --dir assets --pattern '*.apk' --clobber || true
          ls -la assets/ || true

      - name: Scan the DEX and resources for credential patterns
        id: scan
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/scan_release_assets.py assets --tag "$TAG"

      - name: Alert in the Telegram topic when something was found
        if: ${{ steps.scan.outputs.count != '0' }}
        env:
          TG_TOKEN:   ${{ secrets.TG_CHANGELOG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHANGELOG_CHAT_ID }}
          TG_THREAD:  ${{ secrets.TG_CHANGELOG_THREAD_ID }}
          TAG:        ${{ github.event.release.tag_name }}
          REPORT:     ${{ steps.scan.outputs.report }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN", "")
          chat  = os.environ.get("TG_CHAT_ID", "")
          if not token or not chat:
              print("no Telegram credentials in CI — printing to the log instead")
              print(os.environ.get("REPORT", ""))
              raise SystemExit(0)

          text = ("⚠️ Secret scan flagged the published assets of "
                  + os.environ["TAG"] + "\n\n" + os.environ.get("REPORT", "")
              + "\n\nThe release is being returned to draft. Do not install it.")
          data = {"chat_id": chat, "text": text}
          thread = os.environ.get("TG_THREAD", "")
          if thread:
              data["message_thread_id"] = int(thread)
          req = urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % token,
              data=json.dumps(data).encode(),
              headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=20).read()
              print("alert posted")
          except Exception as e:
              # Never fail the job on a notification problem: the finding is already in the log.
              print("could not post the alert:", type(e).__name__)
          EOF

      - name: Quarantine an unsafe release
        if: ${{ always() && (steps.scan.outcome == 'failure' || steps.scan.outputs.count != '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ github.event.release.tag_name }}
          REPO:     ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft

      - name: Summary
        if: always()
        # Same binding, and here the value is even more clearly not ours: the report is built from
        # zip ENTRY NAMES read out of the published APK.
        env:
          COUNT:  ${{ steps.scan.outputs.count }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          if [ "$COUNT" = "0" ]; then
            echo "No credential pattern found in the published assets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Secret scan findings" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # printf, not echo: a report line starting with - would be eaten as a flag.
            printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail an unsafe or incomplete scan
        if: ${{ always() && (steps.scan.outcome == 'failure' || steps.scan.outputs.count != '0') }}
        run: exit 1

  rescan-current-ota-assets:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Rescan current stable and beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          tags="$RUNNER_TEMP/release-tags"
          if ! releases="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"; then
            echo "Could not enumerate published releases"
            exit 1
          fi
          stable="$(printf '%s' "$releases" | jq -r \
            'add | .[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | LC_ALL=C sort -V | tail -n 1)"
          # v1.7.0 predates the scanner and already contains a now-rotated token pattern. Drafting
          # it is a deliberate release operation, not a side effect this new scheduled job may take.
          # Every future stable is scanned normally; remove this exception once a clean stable ships.
          if [[ "$stable" == "v1.7.0" ]]; then
            echo "Skipping known legacy stable v1.7.0; publish a clean stable replacement"
            stable=""
          fi
          beta="$(printf '%s' "$releases" | jq -r \
            'add | .[] | select(.draft == false and .prerelease == true) | .tag_name' \
            | LC_ALL=C sort -V | tail -n 1)"
          printf '%s\n%s\n' "$stable" "$beta" | awk 'NF' | sort -u > "$tags"

          unsafe=0
          index=0
          while IFS= read -r tag; do
            asset_dir="$RUNNER_TEMP/release-assets-$index"
            mkdir -p "$asset_dir"
            if ! gh release download "$tag" --repo "$REPO" --dir "$asset_dir" \
                --pattern '*.apk' --clobber; then
              echo "Could not download release asset for $tag"
              unsafe=1
            elif ! GITHUB_OUTPUT= python3 .github/scripts/scan_release_assets.py \
                "$asset_dir" --tag "$tag"; then
              echo "Quarantining changed or unsafe release $tag"
              gh release edit "$tag" --repo "$REPO" --draft
              unsafe=1
            fi
            index=$((index + 1))
          done < "$tags"
          exit "$unsafe"
