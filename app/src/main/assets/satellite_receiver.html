<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:">
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:sans-serif}video{width:100%;height:100%;object-fit:contain}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#metrics{position:absolute;bottom:8px;left:8px;padding:4px 8px;background:#000b;color:#fff;font-size:12px;pointer-events:none;display:none}</style>
</head><body><video id="video" autoplay playsinline muted></video><div id="status">__WAITING__</div><div id="metrics"></div>
<script>
'use strict';
// Signalling crosses a local Android bridge; this page has no HTTP or WebSocket access.
const video = document.getElementById('video');
const status = document.getElementById('status');
const metrics = document.getElementById('metrics');
let peer = null, owner = null, negotiation = null, chain = Promise.resolve(), watchdog = null;
let lastFrames = -1, lastProgress = 0;
let epoch = 0, queued = 0, statsInFlight = false, metricsVisible = false;
let previousStats = null;
window.setMetricsVisible = value => { metricsVisible = value === true; metrics.style.display = metricsVisible ? 'block' : 'none'; };
function send(type, values) {
  if (owner && negotiation) DashCastVideo.send(owner, JSON.stringify(Object.assign({type, negotiation}, values)));
}
function resetReceiver(invalidate = true) {
  if (invalidate) { epoch++; chain = Promise.resolve(); queued = 0; }
  if (watchdog) clearInterval(watchdog);
  watchdog = null;
  if (peer) { peer.onicecandidate = null; peer.ontrack = null; peer.close(); }
  peer = null; owner = null; negotiation = null;
  video.srcObject = null; status.style.display = 'flex';
  lastFrames = -1; lastProgress = 0; statsInFlight = false; previousStats = null;
  metrics.textContent = '';
}
function bounded(promise) {
  let timer;
  const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('timeout')), 8000); });
  return Promise.race([promise, timeout]).then(value => {
    clearTimeout(timer); return value;
  }, error => { clearTimeout(timer); throw error; });
}

function updateMetrics(stats, report, frames) {
  const clamp = (value, max) => Number.isFinite(value) ? Math.max(0, Math.min(max, value)) : null;
  const codec = stats.get(report.codecId);
  const name = codec && ['video/H264','video/VP8','video/VP9','video/AV1'].includes(codec.mimeType) ? codec.mimeType.slice(6) : '?';
  const width = clamp(report.frameWidth, 8192), height = clamp(report.frameHeight, 8192);
  let fps = clamp(report.framesPerSecond, 120), kbps = null, decodeMs = null;
  if (previousStats && report.timestamp > previousStats.timestamp) {
    const seconds = (report.timestamp - previousStats.timestamp) / 1000;
    const progress = frames - previousStats.frames;
    if (fps === null && progress >= 0) fps = clamp(progress / seconds, 120);
    if (Number.isFinite(report.bytesReceived) && Number.isFinite(previousStats.bytes))
      kbps = clamp((report.bytesReceived - previousStats.bytes) * 8 / seconds / 1000, 100000);
    if (progress > 0 && Number.isFinite(report.totalDecodeTime) && Number.isFinite(previousStats.decode))
      decodeMs = clamp((report.totalDecodeTime - previousStats.decode) * 1000 / progress, 10000);
  }
  previousStats = {timestamp:report.timestamp, frames, bytes:report.bytesReceived, decode:report.totalDecodeTime};
  // Use only explicit platform evidence; codec name or low decode time does not prove hardware.
  const hardware = typeof report.powerEfficientDecoder === 'boolean' ? (report.powerEfficientDecoder ? 'yes' : 'no') : 'unknown';
  const format = value => value === null ? '?' : value.toFixed(1);
  metrics.textContent = `${name} · ${width === null ? '?' : width}×${height === null ? '?' : height} · ${format(fps)} fps · ${format(kbps)} kbps · decode ${format(decodeMs)} ms · dropped ${clamp(report.framesDropped, 1000000000) ?? '?'} · efficient decoder ${hardware}`;
}

async function receive(id, raw) {
  const message = JSON.parse(raw);
  if (message.type === 'video.offer') {
    resetReceiver(false); owner = id; negotiation = message.negotiation;
    const connection = new RTCPeerConnection({iceServers: [], bundlePolicy: 'max-bundle'});
    peer = connection;
    connection.onicecandidate = event => {
      if (peer === connection && event.candidate) send('video.ice', event.candidate.toJSON());
    };
    connection.ontrack = event => {
      if (peer !== connection || event.track.kind !== 'video') return;
      video.srcObject = new MediaStream([event.track]);
      video.play().catch(() => {
        if (peer === connection) { send('video.error', {code:'playback_failed'}); resetReceiver(); }
      });
    };
    connection.onconnectionstatechange = () => {
      if (peer === connection && ['failed', 'closed', 'disconnected'].includes(connection.connectionState)) {
        send('video.error', {code:'connection_lost'}); resetReceiver();
      }
    };
    await bounded(connection.setRemoteDescription({type:'offer', sdp:message.sdp}));
    if (peer !== connection) return;
    const answer = await bounded(connection.createAnswer());
    if (peer !== connection) return;
    await bounded(connection.setLocalDescription(answer));
    if (peer !== connection) return;
    send('video.answer', {sdp:connection.localDescription.sdp});
    // A stopped source must not leave a frozen map visible indefinitely.
    lastProgress = performance.now();
    watchdog = setInterval(() => {
      if (peer !== connection) return;
      // Decoder liveness has its own deadline. A hung getStats promise cannot delay clearing.
      if (performance.now() - lastProgress > 6000) {
        send('video.error', {code:'video_timeout'}); resetReceiver(); return;
      }
      if (statsInFlight) return;
      statsInFlight = true;
      const statsEpoch = epoch;
      bounded(connection.getStats()).then(stats => {
        if (peer !== connection || statsEpoch !== epoch) return;
        let inbound = null;
        stats.forEach(report => {
          if (report.type === 'inbound-rtp' && (report.kind === 'video' || report.mediaType === 'video')) inbound = report;
        });
        let frames = inbound && Number.isFinite(inbound.framesDecoded) ? inbound.framesDecoded : -1;
        if (frames < 0 && typeof video.getVideoPlaybackQuality === 'function') {
          const quality = video.getVideoPlaybackQuality();
          if (quality && Number.isFinite(quality.totalVideoFrames) && Number.isFinite(quality.droppedVideoFrames))
            frames = Math.max(0, quality.totalVideoFrames - quality.droppedVideoFrames);
        }
        if (frames < 0 && Number.isFinite(video.webkitDecodedFrameCount)) frames = video.webkitDecodedFrameCount;
        // Packet counters and control heartbeats never prove successful decoding.
        if (frames > 0 && frames > lastFrames) {
          lastFrames = frames; lastProgress = performance.now(); status.style.display = 'none';
        }
        if (inbound) updateMetrics(stats, inbound, frames);
      }).catch(() => {
        if (peer === connection && statsEpoch === epoch) { send('video.error', {code:'stats_failed'}); resetReceiver(); }
      }).then(() => { if (peer === connection && statsEpoch === epoch) statsInFlight = false; });
    }, 1000);
  } else if (id === owner && message.negotiation === negotiation && peer) {
    if (message.type === 'video.ice') await peer.addIceCandidate({candidate:message.candidate,
      sdpMid:message.sdpMid, sdpMLineIndex:message.sdpMLineIndex});
    else if (message.type === 'video.stop') resetReceiver();
  }
}
window.receiveSignal = (id, raw) => {
  // Bound async signalling as well as native input. A reset invalidates queued old-socket ICE.
  if (queued >= 32) { send('video.error', {code:'signalling_overflow'}); resetReceiver(); return; }
  const submittedEpoch = epoch;
  queued++;
  chain = chain.then(() => {
    if (submittedEpoch === epoch) return receive(id, raw);
  }).catch(() => {
    if (submittedEpoch === epoch) {
      send('video.error', {code:'negotiation_failed'}); resetReceiver();
    }
  }).then(() => { if (submittedEpoch === epoch) queued--; });
};
window.resetReceiver = resetReceiver;
DashCastVideo.ready(typeof RTCPeerConnection !== 'undefined');
</script></body></html>
