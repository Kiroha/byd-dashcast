        // 550 = 1.6.109-beta (three fixes from the 2026-07-05 reports. (1) HOTSPOT persistent keep-alive: the watchdog was activity-scoped (onResume→start, onPause→stop) so "always on" stopped keeping TetherFi up the moment the user left the Hotspot page (INC-20260705-195419); new HotspotKeeper runs the probe→restart loop from the always-on ProxyKeeperService heartbeat (app-wide persistence), BAL-guarded via canDrawOverlays. Boot-without-opening still needs the ROM's auto-start whitelist (device setting). (2) PROJECTION non-layout DL3: a launched app was shown on the cluster but reported as failed → never tracked (no green bar; resize/stop/stop-projection inert; "launch failed" toast) — INC-20260705-195632 Telenav / 195856 Waze; 1.6.106 conflated startActivityViaIAM RETURNING false (IAM reflection failed but startActivity(opts) fallback launched it — normal DL3 success) with THROWING (genuine failure). Now distinguished; return-false=success → app tracked. Also aligns the launch with DaemonConfig's documented design: the uid-2000 daemon is now the PRIMARY launch path in normal mode (as in layout mode) when connected + use_legacy_path OFF; app-side is the gated fallback (new daemonLaunchSync reports success synchronously so the app is tracked). (3) LAYOUT auto-start: with Automatic-favourite-layout AND a favourited single-app auto-launch both on, the single-app path created a classic ClusterService projection → FissionOrchestrator.isClassicProjectionActive() true → the layout's ensureDaemon() aborted with "Daemon unavailable" (byd_log 20260705_194004); mPendingAutoLaunchPkg now suppressed when isLayoutAutoStartConfigured(). DL3/DL5 preserved by the app-side/daemon fallbacks; lint 0/0.)
