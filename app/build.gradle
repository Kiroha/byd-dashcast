apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Bug-report Telegram bot credentials are read from local.properties (never
// committed): they end up in the compiled APK but not in the public repo.
// Keys (all optional — absent → the app falls back to the Telegram share sheet):
//   bugReport.botToken=123456789:ABC...
//   bugReport.chatId=-1003712642112
//   bugReport.threadId=4
def _localProps = new Properties()
def _localPropsFile = rootProject.file('local.properties')
if (_localPropsFile.exists()) {
    _localPropsFile.withInputStream { _localProps.load(it) }
}

android {
    signingConfigs {
        // BYD signature required to access bydauto system APIs
        bydPlatform {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('./keystore/platform.keystore')
            storePassword 'android'
        }
    }

    // La Seal EU tourne sur Android 10 (API 29) — DiLink 3.0
    // compileSdk bumpé à 33 pour pouvoir utiliser Material 3 (com.google.android.material 1.9.x).
    // targetSdkVersion reste à 29 → comportement runtime inchangé sur la Seal.
    namespace "com.byd.dashcast"
    compileSdkVersion 33
    // buildToolsVersion omis : AGP 7.4.2 utilise automatiquement 30.0.3

    defaultConfig {
        applicationId "com.byd.dashcast"
        minSdkVersion 28
        targetSdkVersion 29
        // Public versionName bumped to 1.2.31 for the LOT 3 perf pass:
        //   - ClusterInputForwarder.injectTouchAtMulti: PointerProperties[16] +
        //     PointerCoords[16] pre-allocated once in the constructor, fields
        //     reset per call → 0 array/object allocations per cluster touch event.
        //   - MainActivity.forwardTouchFromMirror: pre-allocated mPointerIds /
        //     mClusterXs / mClusterYs (int[16] / float[16] x2) reused per touch.
        //   - BetaProxyClient.connect() late-arrival recovery: pingBinder()
        //     replaced by isBinderAlive() (the live cache is hooked via
        //     linkToDeath in the broadcast receiver, so isBinderAlive is
        //     accurate — saves one IPC roundtrip on every recovery attempt).
        //   - Phase4Verbs.autoContainerBinder: pingBinder() replaced by
        //     isBinderAlive() + linkToDeath registered on first cache. Saves
        //     one IPC per Phase4Verbs.autoContainerSendInfo() call.
        //   - AppLogger.get(): defensive snapshot under LOCK, StringBuilder
        //     format loop moved outside the lock — logger calls from worker
        //     threads (Beta/ADB/Phase4 probes) no longer wait for the UI thread
        //     to finish formatting 3000 entries.
        //   - AppLogger.getCountByLevel(): incremental int[] counters
        //     maintained in addEntry() / clear() / overflow eviction. LogActivity
        //     refreshLog() no longer walks 3000 entries every 500 ms just to
        //     compute the chip totals.
        // LOT 4 (v1.2.32 / build 228) — hygiene + Waze retry:
        //   - patch_*.py (7 scripts) moved to scripts_archive/ (root cleanup).
        //   - ClusterService.sIsRunning → volatile (auto-resize-thread visibility).
        //   - AdbLocalClient.captureClusterDisplay + BitmapCallback removed
        //     (dead code, 0 caller); Bitmap/BitmapFactory imports pruned.
        //   - MainActivity.autoApplyInsetsIfNeeded(): retry findRunningTaskId up
        //     to 3× with 500 ms backoff when taskId<=0 (Waze post-launch race
        //     observed in BYD_RE_Sniffer_20260523_204155.txt at 20:42:26.696).
        // LOT 5 (v1.2.33 / build 229) — Toast lifecycle:
        //   - 20 Toast.makeText() sites in MainActivity now use
        //     getApplicationContext() instead of the Activity context. Fixes
        //     the "Toast already killed" NotificationService warnings observed
        //     in BYD_RE_Sniffer_20260523_204155.txt at 20:41:58 and 20:44:03
        //     when an Activity instance finishes between makeText() and show().
        //     Application context outlives the Activity → queued Toast always
        //     resolves cleanly. Behaviour is identical for the user.
        //   - #17 (broadcast IBinder signature permission) verified already
        //     fully in place since LOT 2 / 1.2.30 — no additional work needed.
        // v1.2.43-beta (build 301) — Voice tab PoC step 1/3.
        //   - New Diagnostic tab "Voice (alpha)" — fully isolated in
        //     com.byd.dashcast.voice.*. Zero touch to production code paths.
        //   - VoiceService foreground service: AudioRecord 16 kHz mono 16-bit,
