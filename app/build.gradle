        // 487 = 1.6.46-beta (diagnostics for OEM-presented clusters, prompted by DX_BYD_AUTO "HDMI Screen" INC-20260623-063445 where third-party apps don't project — only the native nav does. Bug report now captures: `service list` (to find the OEM projection channel where auto_container is absent), `dumpsys activity containers` (display→TaskDisplayArea→stack hierarchy), and the activity/task context of EVERY non-zero display (grep -A "Display #N", not just #1) so unexpected/extra screens surface. + hardening: guard ClusterMirrorManager projection math against a transient 0×0 getRealSize (avoids divide-by-zero / non-finite projScale corrupting touch mapping during display teardown).).
        // 488 = 1.6.47-beta (deep cluster-gating diagnostics for the DX_BYD_AUTO / Android Automotive investigation INC-20260623-222919, where DashCast can show the OEM system nav (com.neusoft.na.navigation) fullscreen on the cluster but third-party apps placed on the same display do not render. The bug report now also captures, all read-only: FEATURES/PROPS (android.hardware.type.automotive + product/build); CAR UX RESTRICTIONS / DRIVING STATE + CAR SERVICE (cluster/focus/nav/allow-list) — the suspected distraction-optimization gate; CAR SERVICE CLI `get-do-activities` per nav/cluster package (direct answer: is the app allowed to run while driving); PACKAGE FLAGS + PERMISSIONS (system vs third-party privilege); WINDOW DISPLAYS + per-display focus; SurfaceFlinger all-layers z-order; VENDOR HALS + RUNNING SERVICES (cluster/instrument); SETTINGS; DashCast's own grants/flags; INPUT display/viewport; and a tag-filtered window/cluster/car logcat (survives buffer flooding). No behaviour change — capture only.).
        // 489 = 1.6.48-beta (AAOS cluster experiment for DX_BYD_AUTO / Bosch INC-20260624-221542: the bug reports proved the cluster panel is driven by the AAOS cluster-rendering pipeline (InstrumentClusterService + IAutomotiveDisplayProxyService), not a scan of the logical display — so a normal `am start --display 1` shows the app in our preview but never on the physical cluster, and the driving/UX-restriction + system-vs-third-party hypotheses were both ruled out. After the DL5 daemon launch, DashCast now probes the AAOS mechanism `cmd car_service start-fixed-activity <displayId> <pkg> <activity>` and logs the full result, to learn whether it is permitted on this user build and whether it reaches the physical cluster. Gated to PackageManager.FEATURE_AUTOMOTIVE → DL3/DL5 fission ROMs are untouched.).
        // 490 = 1.6.49-beta (HUD nav diag bench for DL3: the HUD nav integration shows nothing on DL3, suspected wrong INSTRUMENT_* feature IDs (the OpenBYD 2.2 APK-reverse set differs from the current Open-BYD repo / DiLink 5.1, and BYD renumbered the registers between versions). New diag screen — Diag → Cluster (POC) → "HUD nav bench (DL3)" — with (1) HudFeatureScraper: reflection dump of the REAL android.hardware.bydauto.* instrument/nav feature-ID constants from the car, and (2) a live bench: Nav ON/OFF + test guidance via CanBusController + a raw featureId+value writer to validate any candidate ID against the cluster. Dev-only, behind diag; built programmatically, no behaviour change to normal flows. Credit: Open-BYD (MIT).).
        // 491 = 1.6.50-beta (AAOS cluster experiment for DX_BYD_AUTO: try to make the physical cluster show a launched app, since the OEM nav can. New "AAOS cluster" section in the HUD diag bench — write the car's own writable vendor VHAL command props (INS_NAV_DISPLAY_MODE_S / INSTRUMENT_MENU_SHOW_STATE / INS_CENTER_DISPLAYS / SWITCH_DISPLAY_MODE) via CarPropertyManager while an app is on Display 1, and probe the IAutomotiveDisplayProxyService HAL that owns the panel. 100% reflection on android.car.* / android.frameworks.automotive.* → no-op on DiLink 3/5 (Class.forName fails, caught); FEATURE_AUTOMOTIVE-gated, behind the diag bench, no daemon/contract change; <uses-library android:name="android.car" required="false"> ignored at install on DiLink. Credit: Open-BYD (MIT).).
        // 492 = 1.6.51-beta (DL3 cold-launch fix, INC-20260625-123938: launching an app that is NOT already running onto the fission VirtualDisplay failed — the IAM fallback startActivity with FREEFORM + launch bounds NPEs server-side (ActivityStack.getBounds() on a not-yet-created stack). startActivityViaIAM now catches that and retries a plain launch targeting only the display (setLaunchDisplayId, no FREEFORM/bounds) so the task is created on the cluster; inset bounds are re-applied by the auto-resize path. DL5 never reaches the new catch (its startActivity succeeds and launchViaDaemonForce takes over) → DL5 unchanged. No daemon/contract change.).
        // 493 = 1.6.52-beta (HUD/AAOS diag bench — full instrumentation, no blind spot on any platform: bench output now (1) shows on screen, (2) is written to the in-app journal so it's captured in bug reports, and (3) is directly exportable via new Share log / Copy log / Clear buttons (FileProvider → Telegram). Testers (DL3 HUD scrape + AAOS cluster experiments) can finally send results without a full bug report or hand transcription. Carries the 1.6.51 DL3 cold-launch fix. Capture-only; no behaviour change; AAOS code stays reflection-only/no-op on DiLink.).
        // 494 = 1.6.53-beta (Kotlin migration lot 6a: app/ lifecycle package (InstallResultReceiver, AppStartupTasks, BootDisplayCleanup, BootReceiver) converted to Kotlin — app/ now 100% Kotlin. Faithful 1:1 (receivers referenced by class → manifest unchanged; run/cleanup as object + @JvmStatic; goAsync/PendingResult + AtomicInteger sentinel preserved in BootReceiver). Touches boot/OTA startup → validate on a real reboot. No behaviour change intended; DL3/DL5 unaffected.).
        // 495 = 1.6.54-beta (HUD diag: one-tap "RUN HUD SELF-TEST & SEND" that runs the full nav sequence with the verified DL3 feature IDs, captures each SDK rc, and auto-uploads the report to the support Telegram topic 2701 — no typing/share sheet. Also corrected the misleading hex comments in CanWriteVerbs (the decimal values were already correct = verified against the live DL3 BYDAutoFeatureIds scrape) and the bench now logs rc per write + prints the verified IDs. DL3/DL5 unaffected; no daemon contract change.).
        // 496 = 1.6.55-beta (HUD self-test: after the writes, an in-app popup asks whether the cluster actually rendered the test guidance (Yes / No / Not sure; on No an optional free-text note). The answer is baked into the uploaded report ("VISUAL RESULT: …") so the visual confirmation no longer depends on the tester replying in Telegram. Popup strings translated into all 13 locales. On DL5.1 a tester reported all 8 writes rc=0 → SDK accepts the nav writes; the visual is now captured. Diag-only UI; no daemon/DL3/DL5 behaviour change.).
        // 497 = 1.6.56-beta (DL3 HUD reverse-engineering harness: one button "RUN FULL DL3 HUD DIAGNOSTIC → ZIP" tries every cluster-driving path — TEST A raw feature-ID writes, TEST B dedicated BYDAutoInstrumentDevice SDK methods (sendAutoNaviStatus/sendSimpleGuidanceInfo/sendNextPathName/sendRestRouteInfo via in-app reflection), TEST C AUTONAVI_STANDARD_BROADCAST_SEND (app + privileged daemon am broadcast) — then scrapes BYDAutoFeatureIds, captures pm list/dumpsys of nav-cluster-instrument packages/logcat, pulls candidate system APKs (<35 MB budget), asks the visual popup, and uploads ONE zip to the support topic. Rationale: Open-BYD's CAN path works on DL5.1 but NOT DL3, so the DL3 mechanism is unknown — this gathers all artifacts for off-car RE. Diag-only; no daemon contract change; DL3/DL5 projection unaffected.).
        // 498 = 1.6.57-beta (DL3 HUD breakthrough capture: decompiling AmapService showed the DL3 cluster is driven by android.os.AutoContainerManager.sendInfo2(4, NaviInfo flatbuffer) when ro.build.system.fission_single_os != "1" (vs BYDAutoInstrumentDevice CAN path on single-OS/DL5.1) — and AmapService forwards the AUTONAVI broadcast to it, so TEST C may already drive the DL3 cluster. The full-diag now captures getprop ro.build.system.fission_single_os (+ full getprop) and a tag-filtered `logcat -s AmapService:V` (the smoking gun for the forward), and shrinks the general logcat to -t 600 so it no longer overflows/kills the daemon parcel. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 499 = 1.6.58-beta (Dedicated AAOS cluster diagnostic: new "AAOS cluster diagnostic" button in Diag → cluster POC opens AaosDiagActivity — ONE button runs the full AaosDiagnosticBundle with LIVE per-step progress (so the user sees it isn't stuck) then zips + uploads to the support Telegram topic. Captures getprop/displays(FLAG_OWN_CONTENT_ONLY)/car_service/activities/window/services/lshal/packages/candidate-dumpsys/logcat/dashcast-grants/AAOS-gate-experiments and pulls candidate cluster/nav/automotive system APKs (<35 MB) for off-car RE — to hunt an unprivileged data-feed path to the cluster (app-window projection is blocked by FLAG_OWN_CONTENT_ONLY + non-user-build/signature gates). Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 500 = 1.6.59-beta (Diag UX: AAOS and the DL3 HUD bench now have their own dedicated top-level Diag tabs (AAOS, HUD DL3) instead of extra buttons inside the Cluster DL3 / cluster POC panel. Each tab is a clean panel with a title, description and a single launch button (AAOS → AaosDiagActivity full cluster diagnostic → zip with live progress; HUD DL3 → HudDiagActivity). Tabs appended (pos 14/15) so existing tab positions are unchanged; the cluster POC panel is no longer a catch-all. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 501 = 1.6.60-beta (HUD DL3 bench simplified: the page had too many buttons (scrape, nav on/off, test guidance, raw write, print IDs, AAOS section, share/copy/clear, self-test) — replaced with the AAOS-style UX: ONE button "RUN FULL DL3 HUD DIAGNOSTIC → ZIP" + a progress bar + live log. The full diagnostic already runs TEST A/B/C + scrape + env + candidate APKs, then asks the visual result (Yes/No/Not sure, optional free-text on No) and uploads one zip to topic 2701. Redundant AAOS section removed (AAOS has its own tab). Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 502 = 1.6.61-beta (AAOS app-projection probe: the AAOS diagnostic (single button) now also runs a Presentation probe — the one untried, non-privileged path to put app content on the cluster. After the env/APK/gate capture it enumerates the displays a normal app can see, picks the cluster, and tries to show a full-screen "DASHCAST" Presentation on it for ~8 s; result written to 15_presentation_probe.txt, then a popup asks if it appeared and the zip is uploaded. Rationale: every privileged path (start-fixed-activity/SurfaceControl/am start --display) is blocked, but Presentation is the standard secondary-display API we never tested from a normal app. Found via RE that com.ts.appservice.cluster exposes an exported, unguarded ClusterCoreService binder (nav DATA feed; not app windows). Progress bar added to the AAOS page. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 503 = 1.6.62-beta (DL3 HUD fix — TYPE must be 1 not 8: the AUTONAVI broadcast reached AmapService but the cluster showed nothing because the SEND_ACTION receiver only processes guidance when the "TYPE" extra is 0 or 1 (after a first-frame reSetGuideInfo that wipes data); we sent TYPE=8 (copied from Open-BYD) → guidance skipped, mIsBYDMapNaving never set, sendNaviToCluster never called → nothing forwarded. The 1.6.59 VISUAL:YES was a false positive (OEM nav active). Fix: HudAutoNaviBroadcast.sendGuide TYPE 8→1 (triggers the forward → sendNaviInfoTo1for2Clster → AutoContainer.sendInfo2 on DL3), sendStop via KEY_TYPE=10019/EXTRA_STATE=9, and the TEST C daemon am broadcast TYPE 8→1. Verified against the fully decompiled AmapService. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 504 = 1.6.63-beta (HUD DL3 diag self-verifying: a 1.6.62 run came back VISUAL "NOT SURE" with no AmapService lines — a capture gap, not a failure (the end-of-run logcat is ~1 s on this very chatty device, so the TEST C forward had scrolled out; the -s TAG -t N filter cuts before filtering → empty). Now ~1.5 s after the TEST C broadcast the diag captures `logcat -d -s AmapService:V` (tag-filtered, tail-capped) straight into 01_tests.txt, so every run carries the cluster-forward proof ("GuideInfo.naviState: 1" + "send_to di1for2 cluster") independently of the visual answer. A 1.6.62 run with proper capture (zip 132042) already showed the full forward. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 505 = 1.6.64-beta (HUD DL3 TEST C sustained frames: a run came back VISUAL NO yet the captured AmapService log showed the FULL correct forward (naviState 1, 300m, TEST, icon 4, send_to di1for2 cluster ×3) — identical to a YES run. So the cluster forward is confirmed/consistent but a single 2-frame burst renders only transiently (tester catches/misses it). TEST C now re-asserts SETTING_NAVI_SCREEN=3, prompts "WATCH THE CLUSTER NOW (~10 s)" and sends 12 sustained AUTONAVI frames (~800 ms apart, distance counting down) like a real nav, so the guidance is persistently displayed + reliably observable (and mirrors the production feed). Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 506 = 1.6.65-beta (Target the windshield HUD: we cracked the DL3 cluster nav strip (photo-confirmed "↰ 300 m TEST"), but the real goal is the windshield HUD. The scrape exposes only HUD CONTROL on BYDAutoSettingDevice (SET_HUD_SWITCH 0x4C10E023, SET_HUD_MODE 0x4C10E025, SETTING_HUD_REQUEST_COMMAND 0x32B0A044) — no HUD content feature, so the HUD projects the instrument nav gated by switch+mode. New TEST D turns the HUD ON, fires the request command, and sweeps SET_HUD_MODE 0..6 while feeding sustained nav frames, with "WATCH THE WINDSHIELD HUD / HUD mode=N" prompts so the tester sees which mode shows nav on the HUD; the popup now asks about the HUD. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 507 = 1.6.66-beta (HUD slow mode sweep: the car HAS a windshield HUD, and all HUD writes are accepted (rc=0) but the 1.6.65 sweep was too fast (~2.5 s/mode) → VISUAL "not sure". TEST D now turns the HUD on, pauses to confirm it's on, then dwells ~5 s per SET_HUD_MODE (0..6) with continuous nav frames and clear "HUD MODE = N — LOOK AT / PHOTOGRAPH THE WINDSHIELD HUD" prompts ("the glass, NOT the cluster"), so one run pins which HUD mode renders the nav. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 508 = 1.6.67-beta (HUD debug plan from 75 reports: cluster nav solved; the HUD reacts to our writes (blue/snow/white/green-text per mode) but never renders our nav, and we can't tell which mode does what. Adds 3 tools to the HUD DL3 page: P1 HUD mode explorer (big "MODE = N" label + HUD ON/OFF + Mode -/+ + Feed-nav-10s → set one mode, photograph the HUD, step); P2 capture the HUD/SettingDevice reaction logcat right after the TEST D sweep into the zip; P4 "CAPTURE OEM HUD BASELINE → ZIP" — clears logcat, lets the REAL OEM nav drive the HUD ~12 s, then dumps HUD/nav/instrument-filtered logcat + foreground/packages/props to reveal which service feeds the HUD. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 509 = 1.6.68-beta (HUD nav-mode reader + cleaner page: the DL3 HUD does turn-by-turn (confirmed) — only the SET_HUD_MODE value the OEM uses for nav is missing (our nav already feeds the instrument guidance). New HudStateReader does a best-effort reflection READ of the BYD feedback features (get(int[]) → BYDAutoEventValue.intValue, or lists get* signatures if absent); CanWriteVerbs + SET_HUD_MODE_FEEDBACK / SET_HUD_SWITCH_STATUS_FEEDBACK; collectHudStateRead polls HUD/nav feedback ~12 s to capture the HUD mode WHILE the OEM nav guides. HUD DL3 page reorganised into a clear numbered flow for testers: STEP 1 Full test (one tap) → STEP 2 While the car's own nav guides (① OEM baseline, ② Read HUD nav mode) → Advanced mode explorer. Diag-only; no daemon contract change; DL3/DL5 unaffected.).
        // 510 = 1.6.69-beta (route the HUD/nav READ through the daemon: the 1.6.68 in-app reader came back "InvocationTargetException: null" on every read — get(int[]) EXISTS but the SDK rejects app-uid reads, exactly like the writes (only the daemon's privileged context is accepted). Adds CanWriteVerbs.getInt/settingGetInt (get(int[]) → BYDAutoEventValue.intValue), daemon TXN_CAN_INSTRUMENT_GET/TXN_CAN_SETTING_GET (PROTOCOL_VERSION 12), ProxyClient.canInstrumentGet/canSettingGet; collectHudStateRead now reads each HUD/nav feedback id via the daemon ~12 s (in-app read kept once for contrast). Also surfaces the real InvocationTargetException CAUSE + lists get* signatures. Additive daemon contract (old clients unchanged); DL3/DL5 unaffected.)
        // 511 = 1.6.70-beta (HUD read self-check: the 1.6.69 daemon read WORKS (no more InvocationTargetException — the in-app failure was confirmed as a SecurityException for BYDAUTO_SETTING_COMMON/INSTRUMENT_COMMON), but every feedback id read back 0, and the OEM baseline logcat showed DashCast's own page in the foreground with NO OEM-nav signals → either the OEM nav wasn't guiding during capture (procedure) or get() can't observe push-only feedback. This adds a daemon write→readback self-check: write SET_HUD_SWITCH=1 / SET_HUD_MODE=2 then read both the set-id and its *_FEEDBACK back. readback==written → get() is a live read (the zeros mean no nav was active); readback stays 0 → feedback is push-only and we must register a BYD listener instead of polling. Diag-only; no daemon contract change; DL3/DL5 unaffected.)
        // 512 = 1.6.71-beta (fold the HUD mode read-back into the FULL test: testers keep running RUN FULL HUD TEST (TEST A-D) rather than the dedicated ② Read HUD nav mode, so TEST D now reads SET_HUD_MODE_FEEDBACK via the daemon right after each SET_HUD_MODE=N write — "readback SET_HUD_MODE_FEEDBACK=X (wrote N)". reflects N → get() is a live read; stays 0/ERR → push-only feedback (need a BYD listener). Makes the full test answer the live-vs-push question too. 1.6.70 full-test zip confirmed cluster forward OK + HUD writes rc=0 but TEST D's logcat reaction is just UI noise (HUD MCU is on CAN, not logcat). Diag-only; no daemon contract change; DL3/DL5 unaffected.)
        // 513 = 1.6.72-beta (VERDICT from 1.6.71: get() is NOT a live read — write SET_HUD_SWITCH=1/SET_HUD_MODE=2 then readback=0, and TEST D readback SET_HUD_MODE_FEEDBACK=0 for every mode 0..6. So HUD/nav feedback is PUSH-ONLY (delivered via a registered BYD listener), not synchronously gettable. The BYD SDK doc gives BYDAutoSettingDevice.registerListener(AbsBYDAutoSettingListener) + onFeatureChanged(String,int)/onXxxChanged callbacks, but AbsBYDAutoSettingListener is a public ABSTRACT class with no compileable stub — subclassing it blind in the daemon could destabilise it (DL3/DL5 risk). So this build DISCOVERS the listener API safely first: HudStateReader.describeClass reflects the CLASS STRUCTURE only (no getInstance, no permission) — abstract methods, ctors, onFeatureChanged/onHUD*/registerListener signatures — into the hud_state_read zip. Next build implements the daemon listener from the confirmed API. Diag-only; no daemon contract change; DL3/DL5 unaffected.)
        // 514 = 1.6.73-beta (PUSH listener — get() is push-only (proven), so register a real BYD setting listener in the daemon to capture what the OEM nav pushes to the HUD. 1.6.72 discovery confirmed AbsBYDAutoSettingListener has a no-arg ctor + NO abstract methods → safe to subclass. The stubs are ALREADY in the repo (app/libs/byd-auto-api-stubs.jar) exposing onFeatureChanged(String,int) + onDataChanged(IBYDAutoEvent) — no new module needed. New CanFeedbackListener (daemon) subclasses AbsBYDAutoSettingListener, registerListener via the privileged context, records pushes (guarded — must never crash the daemon); TXN_CAN_LISTEN_START/DRAIN, PROTOCOL_VERSION 13; ProxyClient.canListenStart/canListenDrain; collectHudStateRead registers the listener then drains ~12 s so the OEM HUD-mode push is captured WHILE its nav guides. Additive daemon contract; DL3/DL5 unaffected.)
        // 515 = 1.6.74-beta (AAOS — definitive app-projection test: probe the automotive display proxy HAL (android.frameworks.automotive.display@1.0/1.1::IAutomotiveDisplayProxyService) — the ONLY way to draw to the AAOS cluster panel (it's not a scan-out of logical display 1). AaosDisplayHalProbe (pure reflection, read-only — never showWindow/posts): class present? getService()? getHGraphicBufferProducer(displayId)? A non-null producer ⇒ projection feasible; absent/null/denied ⇒ definitively closed. Runs IN-APP and VIA DAEMON (uid 2000) for comparison (TXN_AAOS_HAL_PROBE, PROTOCOL_VERSION 14), + lshal automotive.display + SELinux avc denials, into 14_display_hal_probe.txt of the AAOS zip. Additive daemon contract; DL3/DL5/HUD unaffected.)
        versionCode 515
        versionName "1.6.74-beta"

        // Bug-report bot credentials (see note at top of file).
        buildConfigField "String", "BUG_REPORT_BOT_TOKEN",
                "\"${_localProps.getProperty('bugReport.botToken', '')}\""
        buildConfigField "String", "BUG_REPORT_CHAT_ID",
                "\"${_localProps.getProperty('bugReport.chatId', '')}\""
        buildConfigField "String", "BUG_REPORT_THREAD_ID",
                "\"${_localProps.getProperty('bugReport.threadId', '')}\""

        // ONNX Runtime ships pre-built .so for x86, x86_64, armeabi-v7a,
        // arm64-v8a. DiLink hardware is exclusively ARM, so restrict to
        // those two ABIs to keep the APK from ballooning to 60 MB.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            // Platform signature is mandatory even in debug builds for BYD permissions
            signingConfig signingConfigs.bydPlatform
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bydPlatform
        }
    }

    // AGP 8 : BuildConfig n'est plus généré par défaut — requis par 7 classes
    // (ProxyDaemonMain, ProxyClient, ClusterService, UpdateChecker, Settings,
    // Welcome, DiagActivity).
    buildFeatures {
        buildConfig true
    }

    // Ignore les erreurs de lint sur les permissions BYD non connues du SDK standard
    // (AGP 8 : bloc `lint` — l'ancien `lintOptions` a été supprimé)
    lint {
        abortOnError false
    }

    packagingOptions {
        // AGP 8 : remplace android:extractNativeLibs="false" du manifest
        // (même comportement : .so non compressés, chargés depuis l'APK).
        jniLibs {
            useLegacyPackaging = false
        }
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/*.kotlin_module'
        // v1.3.32-beta — voice native libs excluded from APK (~44 MB saved).
        // Downloaded on demand by VoiceLibsManager when voice is first enabled.
        // See scripts/prepare_voice_libs.sh to produce the zip for hosting.
        exclude '**/libonnxruntime.so'
        exclude '**/libonnxruntime4j_jni.so'
        exclude '**/libvosk.so'
        exclude '**/libjnidispatch.so'
    }

    // Java 17 unlocked by AGP 8 (D8 desugars records & co down to API 28).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin migration — must match compileOptions (Java 17) so mixed
    // Java/Kotlin compilation stays consistent during the transition.
    kotlinOptions {
        jvmTarget = '17'
    }


    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "DashCast-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

    // No resolutionStrategy.force needed with these API-29-compatible versions.

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Android 10 era versions (API 29) — minCompileSdk ≤ 29
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Material Components (Material 3) — fournit Theme.Material3.*
    // 1.9.0 = dernière version compatible compileSdk 33.
    implementation 'com.google.android.material:material:1.9.0'

    // dadb — pure-JVM ADB client (same library used by Overdrive)
    implementation 'dev.mobile:dadb:1.2.7'

    // v1.2.43-beta — used by the voice PoC (VoiceService → DiagActivity).
    // In-process broadcast only, no system-wide IPC, no extra permissions.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'

    // v1.2.50-beta — ONNX Runtime for openWakeWord wake-word detection.
    // Scope strictly limited to the Diag Voice tab (com.byd.dashcast.voice.wakeword.*).
    // The library ships native .so for several ABIs; we restrict to arm64+armv7
    // (the only ABIs DiLink 3/4/5 ever run on) via android.defaultConfig.ndk.abiFilters
    // to keep the APK growth under control. The runtime is initialised lazily —
    // production paths never reach this code unless the user toggles the wake-word
    // switch in the Diagnostic tab.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
    // v1.4.0 — Vosk offline speech recognition (post-wake transcription).
    // Small FR model (~40 MB) downloaded on first use via StorageService.unpack().
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // v1.4.2 — Encrypted storage for OpenAI API key
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
