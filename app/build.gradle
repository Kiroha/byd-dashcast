apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Reporting credentials are NOT part of the build any more (audit AUD-001).
//
// They used to be injected from local.properties into BuildConfig, which put them in the DEX of a
// publicly downloadable APK. They now live in EncryptedSharedPreferences on each device and are
// provisioned at runtime by ReportChannel.
//
// A device is normally provisioned by nothing at all: uploads go through the relay, whose address
// is compiled in and is not a credential (see RelayUploader). The file route below exists only for
// a device that must reach Telegram or Azure directly.
//
// NEVER PUSH local.properties ITSELF. It is the maintainer's build file and holds keys that have no
// business on a tester's car: azure.primary.key is a storage ACCOUNT key, granting read, write and
// delete over the whole account, and the Download folder is readable by every app on the head unit.
// Write a file containing only what the device needs:
//   printf 'bugReport.botToken=...\\nbugReport.chatId=...\\n' > /tmp/dashcast_channel.properties
//   adb push /tmp/dashcast_channel.properties /data/local/tmp/
// Accepted keys: bugReport.botToken / chatId / threadId / hudThreadId, azure.blobUrl / azure.sas,
// relay.url. Anything else in the file is ignored by the parser, but it still lands on the car.

android {
    // AUD-156 — the keystore is gitignored, so a fresh clone does not have it. Declaring a
    // signingConfig that points at a missing file made `./gradlew assembleDebug` fail outright on
    // any machine but this one, while SECURITY.md tells readers to "build from source" if they want
    // author-level trust. They could not.
    //
    // The signature itself cannot be shipped and should not be: it is what grants the bydauto
    // system permissions, and an APK signed with it is a privileged APK. So the config becomes
    // conditional. With the keystore present nothing changes.
    //
    // The first version of this was half right, and the half that was wrong shipped in 1.8.33.
    // Leaving `signingConfig` unset is enough for DEBUG, where AGP applies its own debug config —
    // but for RELEASE, AGP applies nothing, and the build produced an APK that `apksigner verify`
    // answers DOES NOT VERIFY on, under the ordinary release filename, while this comment, the
    // console line below and README all claimed it would install and run. An unsigned APK does not
    // install at all. So release now points explicitly at the debug config, which is what all
    // three texts already described.
    //
    // The filename says so too. An unofficially-signed release must be impossible to confuse with
    // a real one — nobody should be able to attach it to a GitHub Release by reaching for the
    // usual name.
    def platformKeystore = file('./keystore/platform.keystore')
    def hasPlatformKeystore = platformKeystore.exists()
    if (!hasPlatformKeystore) {
        // logger.quiet, not logger.lifecycle: LIFECYCLE is above QUIET, so `gradlew -q` — how this
        // project's own build commands are written — swallowed the warning entirely.
        logger.quiet("DashCast: app/keystore/platform.keystore is absent. Debug and release are "
                + "both signed with Gradle's DEBUG key instead, and the release APK is renamed "
                + "-release-debugsigned so it cannot be mistaken for a publishable build. It "
                + "installs and runs; the bydauto system APIs (cluster projection, HUD, uid-2000 "
                + "daemon) are denied at runtime because those need the platform signature.")
    }

    signingConfigs {
        // BYD signature required to access bydauto system APIs
        if (hasPlatformKeystore) {
            bydPlatform {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile platformKeystore
                storePassword 'android'
            }
        }
    }

    // La Seal EU tourne sur Android 10 (API 29) — DiLink 3.0
    // compileSdk bumpé à 33 pour pouvoir utiliser Material 3 (com.google.android.material 1.9.x).
    // targetSdkVersion reste à 29 → comportement runtime inchangé sur la Seal.
    namespace "com.byd.dashcast"
    compileSdkVersion 33
    // buildToolsVersion omis : AGP 7.4.2 utilise automatiquement 30.0.3

    defaultConfig {
        applicationId "com.byd.dashcast"
        minSdkVersion 28
        targetSdkVersion 29
        // Public versionName bumped to 1.2.31 for the LOT 3 perf pass:
        //   - ClusterInputForwarder.injectTouchAtMulti: PointerProperties[16] +
        //     PointerCoords[16] pre-allocated once in the constructor, fields
        //     reset per call → 0 array/object allocations per cluster touch event.
        //   - MainActivity.forwardTouchFromMirror: pre-allocated mPointerIds /
        //     mClusterXs / mClusterYs (int[16] / float[16] x2) reused per touch.
        //   - BetaProxyClient.connect() late-arrival recovery: pingBinder()
        //     replaced by isBinderAlive() (the live cache is hooked via
        //     linkToDeath in the broadcast receiver, so isBinderAlive is
        //     accurate — saves one IPC roundtrip on every recovery attempt).
        //   - Phase4Verbs.autoContainerBinder: pingBinder() replaced by
        //     isBinderAlive() + linkToDeath registered on first cache. Saves
        //     one IPC per Phase4Verbs.autoContainerSendInfo() call.
        //   - AppLogger.get(): defensive snapshot under LOCK, StringBuilder
        //     format loop moved outside the lock — logger calls from worker
        //     threads (Beta/ADB/Phase4 probes) no longer wait for the UI thread
        //     to finish formatting 3000 entries.
        //   - AppLogger.getCountByLevel(): incremental int[] counters
        //     maintained in addEntry() / clear() / overflow eviction. LogActivity
        //     refreshLog() no longer walks 3000 entries every 500 ms just to
        //     compute the chip totals.
        // LOT 4 (v1.2.32 / build 228) — hygiene + Waze retry:
        //   - patch_*.py (7 scripts) moved to scripts_archive/ (root cleanup).
        //   - ClusterService.sIsRunning → volatile (auto-resize-thread visibility).
        //   - AdbLocalClient.captureClusterDisplay + BitmapCallback removed
        //     (dead code, 0 caller); Bitmap/BitmapFactory imports pruned.
        //   - MainActivity.autoApplyInsetsIfNeeded(): retry findRunningTaskId up
        //     to 3× with 500 ms backoff when taskId<=0 (Waze post-launch race
        //     observed in BYD_RE_Sniffer_20260523_204155.txt at 20:42:26.696).
        // LOT 5 (v1.2.33 / build 229) — Toast lifecycle:
        //   - 20 Toast.makeText() sites in MainActivity now use
        //     getApplicationContext() instead of the Activity context. Fixes
        //     the "Toast already killed" NotificationService warnings observed
        //     in BYD_RE_Sniffer_20260523_204155.txt at 20:41:58 and 20:44:03
        //     when an Activity instance finishes between makeText() and show().
        //     Application context outlives the Activity → queued Toast always
        //     resolves cleanly. Behaviour is identical for the user.
        //   - #17 (broadcast IBinder signature permission) verified already
        //     fully in place since LOT 2 / 1.2.30 — no additional work needed.
        // v1.2.43-beta (build 301) — Voice tab PoC step 1/3.
        //   - New Diagnostic tab "Voice (alpha)" — fully isolated in
