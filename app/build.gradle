        // applying it here was not: Android Auto and CarPlay on the cluster are what DashCast is
        // FOR — INC-20260815-181820 itself opens with the tester saying Maps and Waze via Android
        // Auto worked on the screen behind the wheel — and com.byd.carplay.ui is persistent, so the
        // general rule silently removed the headline feature as well as the named one. The
        // maintainer spotted both missing from the picker within hours.
        // The harm in that incident was never in PROJECTING those apps; it was in destroying their
        // task on the way out. That fix (forceStopApp kills, verifies, and only then removes the
        // task) is untouched and remains the real remedy. Prevention by removal traded the
        // product's purpose for a cleanup bug.
        // ProjectionSafetyPolicy now refuses exactly one thing: whatever currently resolves
        // CATEGORY_HOME, the single case with no plausible use behind it (projecting the launcher
        // leaves the head unit with no home screen), still resolved at runtime because the
        // hard-coded launcher list misses the launcher in use on 27 corpus cars. The name list is
        // kept as a named EMPTY set so the next person to reach for one reads why first.
        // Everything else from 1.8.29 stands. 264 unit tests, rewritten to assert that Android Auto
        // and CarPlay stay projectable. assembleDebug + assembleRelease (R8) + lintRelease green.
        // 621 = 1.8.31-beta (the audit's reporting work reaches testers. Three things change for
        // an owner and one of them they will meet immediately.
        // FIRST, A QUESTION. The app now asks, once, before any diagnostic leaves the car, in each
        // of the thirteen languages it ships. It is asked at the first Send rather than at install
        // — a consent question raised before the user knows the feature exists gets dismissed
        // reflexively. Either answer lets the capture proceed: refusing turns the upload into the
        // share sheet the app already offered when no channel was configured, so a refusal keeps a
        // report rather than losing it. Revocable in Settings, and the notice is re-readable there.
        // The gate is in the transport, not in the eleven screens that can start an upload, so all
        // of them inherit it through branches that were already shipped and exercised.
        // SECOND, LESS LEAVES. Reports are filtered before upload: the VIN, Wi-Fi network names,
        // hardware addresses of nearby devices, positions, e-mail addresses and Google account
        // names. The rules were measured against 160 real reports (116 MB) rather than guessed,
        // which is what kept two obvious-looking rules out — a free-floating 17-character VIN match
        // fires 1370 times on that corpus and never once on a VIN (it eats display identifiers, the
        // field every cluster diagnosis is made with), and a decimal coordinate pair is 92% window
        // scales. 128 of the 160 carried something now removed; every diagnostic field verified
        // unchanged.
        // THIRD, THE TOKEN IS OUT OF THE BINARY. AUD-001, the audit's only P0: since versionCode
        // 441 every published APK carried the Telegram bot token in its DEX, extractable with unzip
        // and strings, and rotating it meant reaching every car. Uploads now go through a relay
        // that holds the token server-side, so a decompiled APK yields an HTTPS address and nothing
        // else. THE PRACTICAL CONSEQUENCE FOR TESTERS: the old token has been revoked, so 1.8.29
        // and 1.8.30 can no longer upload anything at all — they fall back to a local save. This
        // version is the fix, and there is no way back to the old channel.
        // Also: the extraction bundle's privacy page said it collects no personal data; it writes an
        // inventory of every installed application, and the page now says so. And the raw-nav-text
        // opt-in did not actually gate the raw text — one ungated Log.d printed the whole
        // notification, and only when parsing failed, which is exactly when a report gets sent.
        // 368 unit tests. assembleDebug + assembleRelease (R8) green; release APK scanned: zero
        // credential patterns in any dex or resource.)
        // 625 = 1.8.35-beta (eleven P2s from the 1.8.33 re-audit, and five of them are the same
        // shape: a finding marked CORRIGE whose fix only covered half the defect. AUD-156 — a
        // release built without the keystore was UNSIGNED, not debug-signed as three of my own
        // texts claimed, so it could not be installed at all; explicit fallback, -debugsigned
        // filename, and logger.quiet because logger.lifecycle is swallowed by `gradlew -q`, which
        // is why I had not seen it. AUD-152 — the mapping archive was written inside app/build/,
        // which `clean` deletes; moved to dist/mappings/ and the retrace procedure, never written,
        // is now in SECURITY.md with a worked example. AUD-003 — if setNaviActive(true) threw,
        // isHudActive stayed false forever: watchdog never armed, closeNavigation a permanent
        // no-op, guidance writes continuing outside the guard, an arrow nothing in the app could
        // clear; session flag and CAN acknowledgement are separate latches now, retry at 5 s
        // instead of every guidance frame. AUD-007 — the abandoned-draft clear ran only in
        // onDestroy, but the activity is singleTask so reopening the keyboard is onStop/onStart;
        // the draft survived exactly the case the fix was written for. AUD-148 — reached only the
        // services list, and its own fix took the OFF badge from 6.9:1 to 3.37:1; contrast
        // recomputed with alpha compositing, third pill added for hidden displays, and the
        // auto-launch badge at 1.63:1 fixed as the same class.
        //
        // Then the storage and report path. One unguarded getExternalFilesDir() was the FIRST
        // statement of pruneOldFiles, and on DL5.1/A13 ROMs that throw it, the caller's
        // catch(Throwable) meant the entire sweep silently did nothing — including the D1 voice
        // reclaim announced to testers in 1.8.33. The screenshot pull waited with no timeout on a
        // ~31 s daemon bootstrap per capture, on the send thread; bounded at 20 s with the
        // non-blocking opt-out this project already uses. The send screen had no exit while that
        // ran; a 45 s watchdog restores Cancel, in thirteen languages. The relay endpoint was
        // storable from a file in world-writable Download without being counted or validated —
        // counted and https-only now, and the unit test that asserted the old behaviour was
        // pinning the defect and is flipped. Two bundles carried private copies of the zipper
        // WITHOUT the redaction pass; a third turned up by grepping rather than assuming, in
        // AaosDiagnosticBundle, which HudCaptureSupport's own docs claimed to protect. One
        // ZipOutputStream left in the whole source tree. 393 unit tests, lint 0/0.)
        // 624 = 1.8.34-beta (the report redactor was not removing positions, and the consent notice
        // shipped in thirteen languages says it is. Found by the 1.8.33 re-audit and confirmed by
        // running the compiled Redactor, not by reading it: three of four real location line shapes
        // passed through in clear. The single GPS rule was anchored on "GpsMonitor", a third-party
        // dashcam tag that exists nowhere else in the tree — not on anything the platform emits.
        // Measured across 178 real reports: that rule covered 16 positions in 16 reports while 218
        // in 19 reports left the car untouched, plus 14 more in 7 reports carried as lat=/lon=
        // parameters by an OEM service. AUD-004's own counter-verification had quoted one of those
        // framework lines as its reason for keeping the finding at P1, and the fix shipped without
        // covering it. Two rules added, both anchored on their carrier and both measured against
        // the corpus rather than guessed: Location[…]/Loc[…] (zero occurrences in 176 reports fall
        // outside the pattern, all four shapes are positional) and keyed lat=/lon= (14 hits, zero
        // outside +/-90 and +/-180). Accuracy, altitude, velocity and satellite counts are kept —
        // they are the diagnostic content and identify nobody; a zero coordinate is kept for the
        // same reason the all-zero MAC is. Verdict from the compiled redactor over all 176 reports:
        // 245 positions removed across 38 reports, 0 left in clear. 383 unit tests, 11 of them new
        // and every one built from a line copied verbatim out of a real report.)
        // 623 = 1.8.33-beta (decision D1 — the voice subsystem is removed. Wake-word -> Vosk ->
        // LLM -> TTS was a proof of concept that lived in the diagnostics surface, and that surface
        // was emptied in 1.7.0: since then nothing in the tree has called VoiceService.start(), so
        // the pipeline has shipped in every APK without a single reachable entry point. Gone: the
        // nine files of voice/, its two tests, the three ONNX wake-word models in assets/, the
        // RECORD_AUDIO permission and the microphone foreground service, the ONNX Runtime and Vosk
        // dependencies, LocalBroadcastManager (the project's only AndroidX-deprecated library, whose
        // seven consumers were six voice classes plus MainActivity's subscriber to them), the Vosk
        // preference, three notification strings in thirteen locales, and scripts/prepare_voice_libs.sh.
        // Kept, contrary to the audit's expectation: androidx.security:security-crypto — the audit
        // recorded its only user as the voice engine's OpenAI key, but ReportChannel now holds the
        // runtime-provisioned bug-report credential in it. It stays the last alpha dependency.
        // Also a courtesy: a user who tried the PoC is holding a downloaded Vosk model (~40 MB, up
        // to ~1.3 GB on the large one) and ~25 MB of native libraries that no code can open any
        // more, so AppLogger's housekeeping sweep now removes those three directories outright
        // instead of only their .download.tmp leftovers. No behaviour change on any reachable path;
        // no daemon protocol change.)
        // 622 = 1.8.32-beta (wave V2 of the audit: the last three P1s, all in paths a driver feels
        // within seconds and none reproducible off a car.
        // CLUSTER TOUCH COMES BACK BY ITSELF. AUD-009: the app runs two uid-2000 daemons, and five
        // sites answered the death of the SURFACE one by invalidating the PROXY one's cache. The
        // proxy daemon — alive, different process — was reconnected for nothing while the dead
        // reference stayed cached, so every subsequent finger movement went to the same corpse and
        // the cluster stopped responding until the app was killed. Split into seven commits, the
        // touch path alone in its own, because it is the regression nobody can reach remotely.
        // THE WINDSHIELD ARROW STOPS BLINKING. AUD-003: liveness was tied to content. Maps re-posts
        // the same notification while the distance has not changed — about 28 s at 130 km/h — the
        // listener's dedup swallowed those re-posts before lastUpdateMs was written, and the 12 s
        // watchdog cleared a HUD that was perfectly correct. Liveness now follows a re-post of the
        // frame already displayed, and only when that frame actually reached the HUD, so the
        // watchdog still catches the frozen arrow it was built for.
        // THE KEYBOARD BRIDGE SENDS WHAT YOU TYPED. AUD-007: mPendingText was shared state read at
        // run time; between the Enter and its flush the bridge cleared its own box and that clear
        // was relayed, so the destination went out empty and the field was wiped. Text is now
        // captured when Done is pressed, the bridge no longer relays its own housekeeping, and a
        // draft abandoned in one session no longer replays onto the cluster in the next.
        // Found by a pre-release audit, before shipping: my own AUD-009 fix had put a BLOCKING
        // pingBinder inside the view traversal — getSurfaceDaemonBinder is reached from
        // addOnLayoutChangeListener on every layout pass, not "at mirror start and stop" as the
        // comment claimed. A wedged daemon would have blocked the traversal. The ping now runs off
        // the main thread and the cache is repaired for the next caller.
        // NOT VALIDATED ON A CAR. All three need the vehicle; the release exists to get them there.
        // 375 unit tests, lint 0/0, release APK scanned: no credential pattern.)
        versionCode 625
        versionName "1.8.35-beta"

        // Ship only the locales the app actually translates (verified against
        // res/values-*: 12 + base en). Strips ~58 dead AndroidX/Material locale
        // folders from resources.arsc — smaller APK for the bandwidth-limited
        // on-car OTA. Perf audit 2026-07-05 finding #16.
        resConfigs 'ar', 'be', 'de', 'en', 'es', 'it', 'kk', 'pl', 'ru', 'tr', 'uk', 'uz'

        // AUD-001 — no credential is compiled into the APK any more.
        //
        // These used to be five buildConfigField entries fed from local.properties. A String
        // constant is inlined by R8 into the DEX pool, so `unzip` plus `strings` handed the bot
        // token to anyone who downloaded a release; the Azure SAS added in 1.8.21 repeated the
        // pattern. Credentials now live in EncryptedSharedPreferences on each device and are
        // provisioned at runtime — see ReportChannel.
        //
        // To provision a device that needs a direct channel, write a file holding ONLY the
        // reporting keys and push that. Never local.properties itself: it also carries
        // azure.primary.key, a storage account key. See the header of this file.

        // ONNX Runtime ships pre-built .so for x86, x86_64, armeabi-v7a,
        // arm64-v8a. DiLink hardware is exclusively ARM, so restrict to
        // those two ABIs to keep the APK from ballooning to 60 MB.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            // Platform signature is mandatory even in debug builds for BYD permissions.
            //
            // AUD-155 — and it makes this variant sharper than a debug build usually is. AGP leaves
            // it `debuggable`, so the APK holds platform permissions AND accepts a debugger. On a
            // head unit that is not academic: DashCast cannot work at all unless ADB over TCP is
            // enabled, so the port an attacker would need is open by requirement, not by accident.
            //
            // Deliberately NOT set to debuggable false: that is what the variant is for, and a
            // developer who cannot debug will simply build a release and lose the stack traces.
            // The control is that debug builds stay off cars — stated in README.md and SECURITY.md
            // rather than left for someone to infer from "same platform-signed APK".
            if (hasPlatformKeystore) signingConfig signingConfigs.bydPlatform
        }
            // R8 enabled (issue #78 hardening). Keep rules in proguard-rules.pro
            // are conservative (whole proxy.** kept) because the daemon is launched
            // by name via app_process. MUST be on-car validated before shipping.
        release {
            minifyEnabled true
            // AUD-196 — R8 has been shrinking the code since 1.8.x while every unused
            // AndroidX and Material resource stayed in the APK. The usual reason to hold this
            // back is a resource named at runtime, which the shrinker cannot see; there is no
            // such call site in this app (no getIdentifier() anywhere in app/src/main/java),
            // so no res/raw/keep.xml is needed. If one is ever added, it needs a keep rule.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Explicit fallback: unset means UNSIGNED on release, not debug-signed.
            signingConfig hasPlatformKeystore ? signingConfigs.bydPlatform : signingConfigs.debug
        }
    }

    // AGP 8 : BuildConfig n'est plus généré par défaut — requis par 7 classes
    // (ProxyDaemonMain, ProxyClient, ClusterService, UpdateChecker, Settings,
    // Welcome, DiagActivity).
    buildFeatures {
        buildConfig true
    }

    // Ignore les erreurs de lint sur les permissions BYD non connues du SDK standard
    // (AGP 8 : bloc `lint` — l'ancien `lintOptions` a été supprimé)
    lint {
        abortOnError false
    }

    packagingOptions {
        // AGP 8 : remplace android:extractNativeLibs="false" du manifest
        // (même comportement : .so non compressés, chargés depuis l'APK).
        jniLibs {
            useLegacyPackaging = false
        }
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/*.kotlin_module'
    }

    // Java 17 unlocked by AGP 8 (D8 desugars records & co down to API 28).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin migration — must match compileOptions (Java 17) so mixed
    // Java/Kotlin compilation stays consistent during the transition.
    kotlinOptions {
        jvmTarget = '17'
    }


    // PRE-0 (audit) — Robolectric needs the merged resources and the manifest on the unit-test
    // classpath. Nothing else changes: the 232 existing plain-JUnit tests never touch an Android
    // API, so enabling this cannot alter their behaviour. returnDefaultValues is deliberately NOT
    // set — it would silently turn "this test touches Android" into a passing test, which is the
    // opposite of what a characterisation net is for.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // AUD-156 — a release the platform key did not sign must not wear the release name.
            def suffix = (!hasPlatformKeystore && variant.buildType.name == 'release') ? '-debugsigned' : ''
            outputFileName = "DashCast-v${variant.versionName}-${variant.buildType.name}${suffix}.apk"
        }

        // AUD-152 — keep the mapping WITH the release it belongs to.
        //
        // R8 renames everything outside `com.byd.dashcast.proxy.**`, so a stack trace from a car
        // arrives as `a.b.c(SourceFile)` and means nothing without the mapping that produced it.
        // AGP does write one, to build/outputs/mapping/release/mapping.txt — a path that is
        // overwritten by the next build and carries no version. So the artefact needed to read a
        // field report is destroyed by the act of preparing the following release.
        //
        // Copied here under the same name as the APK it decodes, so the two travel together and a
        // report from 1.8.31 can still be read after 1.8.40 has shipped. Publishing it costs
        // nothing: this repository is public, so the mapping reveals strictly less than the source
        // already does.
        if (variant.buildType.minifyEnabled) {
            // The path, not variant.mappingFileProvider: the provider carries task references and
            // the configuration cache refuses to serialise them, failing the build with a wall of
            // "cannot serialize object of type ...Task". The location is stable AGP output.
            def buildTypeName = variant.buildType.name
            def apkVersionName = variant.versionName
            def mappingCopy = tasks.register("copyMapping${variant.name.capitalize()}", Copy) {
                from layout.buildDirectory.file("outputs/mapping/${buildTypeName}/mapping.txt")
                // NOT into build/ at all — that was the hole in the first version of this fix.
                // `outputs/mapping-archive` sat inside app/build/, which .gitignore excludes and
                // `clean` deletes, so the artefact meant to outlive the next release was destroyed
                // by the next release. It has to live outside the build directory to mean anything.
                //
                // NOT into outputs/apk either: AGP's own createReleaseApkListingFileRedirect reads
                // that directory, and Gradle refuses the implicit dependency writing there creates.
                into rootProject.layout.projectDirectory.dir("dist/mappings")
                rename { "DashCast-v${apkVersionName}-mapping.txt" }
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
            variant.assembleProvider.configure { finalizedBy(mappingCopy) }
        }
    }
}

    // No resolutionStrategy.force needed with these API-29-compatible versions.

dependencies {
    // AUD-196 — byd-auto-api-stubs.jar is compile-time only. Its 54 classes live in the
    // android.hardware.* namespace, which means the real ones come from the head unit's boot
    // classpath and win over anything in our dex anyway: shipping the stubs added 49 dead
    // classes to classes.dex. Worse if they were ever reached — a listener subclassing our
    // stub would be rejected by the platform's own registerListener(realType). The only
    // compile-time need is CanFeedbackListener's two `extends AbsBYDAuto*Listener` sinks
    // (CanFeedbackListener.java:125,140,156); everything else already goes through
    // Class.forName, and every one of those paths is inside a catch (Throwable).
    compileOnly fileTree(include: ['*.jar'], dir: 'libs')
    testCompileOnly fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'

    // PRE-0 (audit) — characterisation-test harness. The audit established that the only test
    // dependency was plain JUnit 4, so everything touching Context / Binder / Handler / Surface /
    // ADB / the daemon was structurally untestable — i.e. the ~15 600 lines of the eleven files
    // over 1 000 lines, which are exactly what waves V2, V5 and V6 modify. Robolectric 4.13 is the
    // last release in this project's offline cache and supports Java 17 + compileSdk 33.
    testImplementation 'org.robolectric:robolectric:4.13'
    // Android 10 era versions (API 29) — minCompileSdk ≤ 29
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Material Components (Material 3) — fournit Theme.Material3.*
    // 1.9.0 = dernière version compatible compileSdk 33.
    implementation 'com.google.android.material:material:1.9.0'

    // dadb — pure-JVM ADB client (same library used by Overdrive)
    implementation 'dev.mobile:dadb:2.0.0'

    // D1 — ONNX Runtime, Vosk and LocalBroadcastManager left with the voice subsystem
    // in 1.8.33-beta. They were the project's only deprecated library and its heaviest
    // native payload, and every consumer of all three was code with no entry point.

    // Encrypted storage. Introduced for the voice PoC's OpenAI key; the only user now is
    // ReportChannel, which holds the bug-report credential provisioned at runtime — so this
    // one stays. It is the project's last alpha dependency, and it sits on the Android
    // KeyStore path, which is the component OEM ROMs diverge on most: worth requalifying.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // v1.8.13 — FlatBuffers runtime, to encode the OEM's own byd.fbs.naviInfo.NaviInfo
    // wire format for AutoContainer.sendInfo2(4, bytes) (HUD turn-by-turn injection).
    implementation 'com.google.flatbuffers:flatbuffers-java:2.0.3'

    // v1.8.24 — Hidden-API bypass for the uid-2000 daemon (ProxyDaemonMain), which never had ANY
    // hidden-API unlock (SurfaceDaemon.java / ClusterMirrorManager.kt each hand-roll their own via
    // double reflection, but that state is per-process/per-ART-VM — it never covered the daemon
    // process that actually makes the failing calls). Pure-Java, stable on API 10+ (does not touch
    // internal ART structures, unlike the hand-rolled meta-reflection trick this replaces — which
    // this library's own README warns "will be blocked"). Apache 2.0.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
