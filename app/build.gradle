        //       F02). "unable to resolve" output is now a FAIL.
        //     - F06 / F10 use awk to find the displayId that immediately
        //       precedes the Yandex task in the dumpsys hierarchy (real
        //       per-task displayId, not a substring sweep).
        //     - F08 scopes `mBounds=Rect` extraction to the specific
