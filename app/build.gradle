        // 553 = 1.6.112-beta (ROOT CAUSE of "App not shown" on the cluster, INC-20260714-215700, DiLink 3.0/Waze — four fixes. (A) cleanFissionStacks HAS NEVER REMOVED A SINGLE STACK, on any car, since it was written: it read windowingMode/activityType as PUBLIC FIELDS of ActivityManager.StackInfo (Android 10) / RootTaskInfo (Android 12) — those fields do not exist, the values live in configuration.windowConfiguration — so every stack was logged "wm=-1 at=-1 (unreadable, defensive keep)" and the verb was a silent no-op (confirmed: removed=0 in 17/17 on-car bug reports). Consequence: a stale split-screen-primary stack (stackId=5, 0 tasks) survived on the fission display, and `am start-activity --windowingMode 5 --display 1` then threw NPE inside system_server (ActivityStack.getBounds() on null, at ActivityStack.onConfigurationChanged ← setWindowingMode ← ActivityStack.<init> ← ActivityDisplay.createStackUnchecked) — no stack, no activity, nothing on the cluster. New readWindowingMode()/readActivityType() resolve through 4 routes (getter on the info object; configuration.windowConfiguration getter; textual mWindowingMode=/mActivityType= parse; legacy field), and cleanFissionStacks now removes every non-fullscreen, non-home stack that holds ZERO tasks (the stale split-screen one included) while KEEPING fullscreen, home and every task-holding stack — emptiness is a necessary condition for removal, so it can never tear down a running projection: on DL3 the live projection legitimately sits in a SPLIT_SCREEN_PRIMARY stack after a resize (moveAndResize → setTaskWindowingModeWithBounds drives setCustomTaskWindowingModeSplitScreenPrimary with modes {5,3,0}), and split mode launches the 2nd app while the 1st stays live. The INC-20260714 zombie has 0 tasks, so it is still destroyed. (B) daemonLaunchSync now HONOURS the daemon's own verdict: the cascade polls for the task and appends "FAIL: no task discovered" when none appeared; that verdict is authoritative and wins over the am transcript, which read like a success ("Starting: Intent") on a launch system_server had thrown away → 1.6.110 reported ok=true, registered Waze as projected, mirrored an EMPTY display and suppressed the app-side fallback. The DL5.1 benign-NoSuchMethodException fix (INC-20260706-070423) is preserved: "exception" is still not a failure signal. (C) the daemon's own start-success test only looked for "Error:" — an am transcript that says "Exception occurred while executing" is now correctly a FAILED start, so the fallback attempts actually run. (D) new last-resort `am start-activity` WITHOUT --windowingMode 5, run only after both freeform attempts failed: the app lands in the display's default fullscreen stack and is at least VISIBLE on the cluster instead of nothing. DL4/DL5.1 unaffected (their windowingMode-5 path succeeds and never reaches D); lint 0/0.)
        // 554 = 1.6.113-beta (RICHER, TRANSLATED HUD bug reports so testers' NO answers are finally analysable. Two parts, HudDiagActivity only. (1) MAX LOGS in every bench + confirm zip: 03_logcat.txt (recent unfiltered logcat, bounded to ~400KB for the binder parcel), 04_hud_state.txt (the HUD's ACTUAL switch + display-mode from the BYDAuto push-feedback listener — canListenStart() is now registered at onCreate so the OEM push at nav-start is captured; get() is push-only so drain() is the only truth: 0x38B0001C=switch 1on/2off, 0x38B0000D/0x42E00008=display mode 1..6 → we can finally tell a HUD-off / speed-only-mode NO apart from a real render failure), 05_device_state.txt (foreground app + activities-per-display + displays + recent avc denials via dumpsys through the uid-2000 daemon). (2) STRUCTURED, TRANSLATED result choices: the CAN→HUD bench result is now a 5-option picker in the tester's language (arrow-correct / arrow-wrong-direction / distance-text-but-no-arrow / nothing / other+free-text) instead of a French OUI/NON; confirm buttons (Yes/No/Skip) translated too. Each choice records a CANONICAL ENGLISH tag into the zip so analyze_hud.py still counts YES vs NO/PARTIAL AND gets a machine-readable sub-reason. New R.string.hud_bench_* / hud_confirm_* / hud_report_send added in ALL 13 locales (values/ FR default + ar be de en es it kk pl ru tr uk uz); MissingTranslation 0. Only HudDiagActivity.kt + the 13 strings.xml changed; no daemon protocol change; no behaviour change outside the dev diag screen; DL3/DL4/DL5/AAOS prod paths untouched; assembleRelease + lint 0/0.)
        // 555 = 1.6.114-beta (ships the four cluster-launch fixes of build 553, which was never released: the 1.6.113 HUD bug-report work landed on top of them, so this build carries BOTH. No code change of its own — version bump only. See the build-553 entry above for the full root-cause write-up of INC-20260714-215700.)
        // 556 = 1.6.115-beta (the in-app BUG REPORTER — the navrail 🐞 button, the only channel a regular user has now that DL3 HUD turn-by-turn is in production — becomes structured + HUD-aware. (1) CATEGORY PICKER: a 9-option radio group at the top of BugReportActivity (HUD navigation / cluster-dashboard display / screen mirroring / app launch / voice / Wi-Fi-hotspot / OTA update / crash-freeze / other), so a user can say WHICH area their bug is about. The label is shown TRANSLATED in all 13 locales (new R.string.bug_cat_* in values/ FR + ar be de en es it kk pl ru tr uk uz; MissingTranslation 0), but a CANONICAL ENGLISH tag is written into the report caption ("Category: HUD navigation") for triage. (2) HUD FIRMWARE in the dump: BugReportCapture now greps getprop for inswver (the SX<NNN> HUD MCU firmware that pins arrow-capability) + HUD props. (3) LIVE HUD STATE: ProxyKeeperService now keeps the BYDAuto push-feedback listener registered app-wide (off-thread, guarded, idempotent, re-armed after a daemon reconnect) so the report carries a real HUD STATE section (canListenDrain: 0x38B0001C switch 1on/2off, 0x38B0000D/0x42E00008 display mode 1..6) — this state is push-only (get() returns 0), so a cold general report could not read it before. The existing dump already captured CPU/mem/logcat×3/displays/car_service/SurfaceFlinger/daemon-logs, so this only adds the HUD-specific gaps. Files: BugReportActivity.kt, BugReportCapture.java, ProxyKeeperService.java, activity_bug_report.xml, 13 strings.xml. No daemon protocol change; the listener registration is guarded and cannot crash the daemon; DL3/DL4/DL5/AAOS prod paths unaffected; assembleRelease + lint 0/0.)
        // 557 = 1.6.116-beta (CORRECTION of 1.6.115: the category picker went to the WRONG screen. The navrail 🐞 button and the floating button both launch BugWizardActivity (a Category→App→Issue wizard that has REPLACED BugReportActivity since 1.5.4 — BugReportActivity is declared but never started), so the RadioGroup I added to BugReportActivity was dead code the user could never reach. Fixes: (1) REVERTED that dead picker — the BugReportActivity layout RadioGroup, its Kotlin wiring, and the 13× bug_cat_* strings are removed; BugReportActivity is back to its original Title/Steps/Result form. (2) Put categories where they belong — the WIZARD: added a new "HUD navigation" category (first, 🧭) with its own bug_issues_hud list (no arrow / wrong direction / wrong distance-road / HUD stays off / arrow frozen / other), translated in all 13 locales; CAT_EMOJIS + CAT_KEYS + ISSUE_ARRAYS kept in lockstep with the bug_categories array. (3) Made the wizard reports ANALYSABLE across languages: the wizard now also writes a canonical "CategoryKey:" (stable English key: hud/mirror/app/…) alongside the translated "Category:" label, so incident triage can group them (the label alone is Spiegelung/Yansıtma/Mirror, ungroupable). The 1.6.115 HUD-capture wins are UNAFFECTED and correct — BugReportCapture (inswver + HUD STATE) and the ProxyKeeperService always-on listener already flow into the wizard via BugReportCapture.capture(). Off-repo: hud_reports/analyze_incidents.py parses the wizard reports (Category/CategoryKey/App/Issue/HUD STATE/inswver). No daemon protocol change; prod paths untouched; assembleRelease + lint 0/0; MissingTranslation 0.)
        // 558 = 1.6.117-beta (two HUD nav fixes from field report INC-20260715-125508, DL3/SX245/Maps-ReVanced, "Flèche figée"/frozen arrow. (1) STALENESS WATCHDOG in HudController: the prod guidance path is on-change/dedup with NO periodic re-push, so when a nav app's notifications stop flowing (nav paused/ended without a clean stop, a parse gap, Maps backgrounded) the last CAN arrow stays LATCHED on the HUD → a frozen arrow. New watchdog (single daemon scheduler thread, ticks every STALE_MS/2) clears the HUD via closeNavigation() after STALE_MS=12s with no update — mirrors OpenBYD's staleness-close. update/close/tick are now synchronized on the singleton so the watchdog and the notification-writer thread never race; appContext is the process-scoped app context (safe to retain). (2) NAV PARSE diagnostic in MapNotificationListenerService: we render arrows correctly (video-proven output) but had NEVER verified the INPUT — reading the maneuver direction from a real Google Maps/Waze notification. Now, per distinct (icon|road) maneuver (deduped so it never floods the ~1Hz distance ticks), we write to the DashCast journal — hence into every bug report — the RAW notification (small-icon resource entry name + title/text/bigText) alongside the PARSED output (icon id + which source resolved it: resource / text-keyword / straight-default). One real Maps drive now yields ground truth: what the notification said vs the arrow we produced, so the 13-language text table + icon-resource mapping can finally be validated/fixed. No daemon protocol change; prod paths otherwise unchanged; DL3-gated; assembleRelease + lint 0/0.)
        // 559 = 1.6.118-beta (Delta hardening — 11 findings fixed in the code ADDED since the 1.6.108 hardening pass (windshield HUD turn-by-turn, HotspotKeeper, daemon-launch rework, applied perf patches). A verified re-audit found ZERO regressions of the prior 30 fixes. Each fix was read-confirmed against current code + built clean (lint 0/0), one commit per fix. CORRECTNESS: daemonLaunchSync ANDed its authoritative daemon verdict with an am-transcript keyword the daemon never emits on success, so a task-PROVEN cluster launch was reported FAILED — it dropped the app's tracking (green bar / resize) and forced the DL5-denied app-side fallback; the daemon's poll verdict is now authoritative (D1). launchOnDashboardWithBounds still fire-and-forgot launchViaDaemonForce and posted unconditional success — routed through the same verdict-checked daemonLaunchSync (D6). cleanFissionStacks treated an UNREADABLE task list (getChildTaskIds()==null) as 0 tasks and could removeStack() a LIVE projection (blank cluster/HUD) — now a defensive keep (D2). RESOURCE/RELIABILITY: HotspotKeeper relaunched TetherFi as a foreground Activity every 30s forever — added a give-up ceiling that resets on an UP probe (D3) + a staleness guard so probeInFlight can't stick true and silently kill the keeper (D4). HudController's staleness-watchdog ScheduledExecutorService is now shut down when nav stops instead of leaking a daemon thread on the static singleton (D7), and its stale-close no longer runs a ~23s blocking daemon bootstrap under the `this` monitor (D8). ProxyKeeperService arms the HUD listener on a reused serial executor instead of a raw Thread per 10s heartbeat (D9). BugReportCapture.hudStateSnapshot no longer blocks the offline-report worker on a down daemon (D5). HudDiagActivity restores its diag UI in a finally when bg work throws (D10). MainActivity's resize-affordance probe reaches the Activity via WeakReference so it can't retain a destroyed instance (D11). All daemon-down / reconnect paths reuse the F5/F6 non-blocking-reconnect opt-out. No daemon protocol change; behaviour preserved; DL3/DL5 unaffected; lint 0/0.)
        // 560 = 1.6.119-beta (BUG REPORT fixed on Android 13 / DL5.1. On A13 the shell (uid 2000) is denied write access to the app's /sdcard/Android/data/<pkg> dir by scoped storage, so the report's shell dump redirected there failed with EACCES and only the journal was delivered — "[report body build failed: FileNotFoundException … EACCES]" (INC-20260715-191229, D50F_LC/trinket/A13, @kodai_matsumoto). No filesystem path is shared between the app (uid 10xxx) and the shell (uid 2000) on A13, so the body must come back through the shell channel. On SDK_INT>=33 the dump is now staged in /data/local/tmp (uid 2000 owns it), `cat`-ed back to stdout in the SAME shell round-trip (the app can't read /data/local/tmp on A13 but the shell can), and finish() writes the final report into the app's own external dir (which the app CAN write — the journal-only fallback already proved that). finish() gains a preReadShellBody param and NEVER reads the external file on A13 (that readFile was the EACCES site). New AdbLocalClient.executeShellWithResultUnlogged: same as executeShellWithResult but logs only cmd length + byte count, so the ~1 MB body doesn't bloat the journal that is itself embedded in the report. dadb.getAllOutput() has no size cap so the full body returns. Gated to A13 precisely — A10 (DL3/DL4) keeps the direct-external-write fast path unchanged (stageInTmp=false), zero behaviour change; widen to >=30 if an A11/A12 unit ever reports the same EACCES (uid 2000 always owns /data/local/tmp). Two files (BugReportCapture, AdbLocalClient); no daemon protocol change; lint 0/0.)
        // 561 = 1.6.120-beta (Follow-up audit pass — a regression review of the 1.6.118 delta fixes + a fresh SECURITY lens (the concurrency/lifecycle audits never ran one) found 8 issues, all fixed here, one commit each, lint 0/0. REGRESSIONS of my own 1.6.118 HotspotKeeper changes: the D3 give-up ceiling was a PERMANENT latch — the keep-alive stopped recovering forever because the counter only reset on an UP probe, which can never happen once the keeper stops starting TetherFi — now a self-healing BACKOFF (retries after GIVE_UP_COOLDOWN) + a reset on the pref off→on edge (R1); the D4 stuck-probe reset could let a stale ShellGateway callback clobber a newer probe's flag / reset the counter on old state — now each probe carries a generation token (R2). PRIVACY / data-hygiene (these all flow into the journal → Telegram bug reports): raw Google Maps/Waze nav content (destination / current road / ETA = location PII) redacted to lengths + a road-found flag (H1); the LLM voice assistant's raw response + spoken reply (conversation PII) no longer logged — only the non-PII cmd/pkg (H2); the HUD raw recorder's device-wide `logcat -b all` now requires explicit consent before auto-uploading (the capture itself is unchanged — its RE purpose needs the full log) (H3). DAEMON SECURITY (every change is SAFE-BY-DESIGN — fall-open on unresolved uid / best-effort addService / null-fallback cross-check — so it can NEVER break the daemon connection, including on unsigned DL5.1 where the shell does not hold the app's signature permission, and across the update transition where a pre-change daemon is still running): MirrorDaemon + ProxyDaemon now gate onTransact on the caller uid (only the app + system + the daemon's own uid may drive the privileged input-injection / trusted-display / TXN_EXEC-shell-as-uid-2000 verbs — enforceInterface is a public constant, NOT authentication) (S1); and the app authenticates the DAEMON_READY / PROXY_CONNECTED broadcast binders against the daemon's global-ServiceManager registration (only uid-2000/system can addService — SELinux blocks untrusted apps — and BinderProxy identity is stable), so a co-installed app can no longer hijack the daemon connection with a spoofed broadcast binder; relaying the real binder is harmless (it IS the real daemon) (S2, S3). Deliberately NOT using a signature-permission gate on the receivers — that would drop the daemon's own broadcast on non-platform-signed ROMs. No daemon protocol change; behaviour preserved; DL3/DL5 unaffected.)
        // 562 = 1.6.121-beta (DL3 single-OS cluster: stop the silent 20s activation loop + tell the user. On a single-OS DL3 (ro.build.system.fission_single_os=1) the cluster is rendered natively (Qt/fission_service[ivi]) and NO projectable Android VirtualDisplay is ever created — proven decisive by mNextNonDefaultDisplayId=1 for the whole boot + AutoContainer replying "no AutoContainerNative" (INC-20260715-140107 / -140551, @Kadir000000). DashCast looped the full 30→16→35 activation → 20s timeout, repeatedly, showing nothing with no explanation. The existing single-OS guards (onSendToDashboard, startNativeProjection) were INEFFECTIVE because isClusterSingleOs() read the prop via in-process SystemProperties.get, which returns "" on these cars (the app's SELinux domain can't read the vendor prop — the uid-2000 shell CAN, which is why the bug report's getprop shows [1]). Fix: (1) Platform gains a persisted runtime single-OS verdict — isClusterSingleOs() now ORs the in-process read with a flag set by noteClusterSingleOsDetected() and loaded by primeClusterSingleOs(); (2) ClusterService.onCreate reads fission_single_os via the uid-2000 shell (getprop) and, on "1", persists the verdict, so the guards fire before wasting an activation cycle; (3) ClusterManager.activateClusterDisplay short-circuits to onDisplayTimeout when DL3+single-OS, and ClusterService shows the "Projection cluster indisponible" notification (startNativeProjection guard + onDashboardDisplayDisconnected) instead of the generic "disconnected". The flag is set ONLY from the AUTHORITATIVE, race-free fission_single_os=="1" read — deliberately NOT from a transient "no AutoContainerNative" reply, which can occur in a boot race on a WORKING 1-for-2 and would permanently disable it. STRICT: every path gates on isDiLink3, so DL5.1 (also single-OS) and a 1-for-2 DL3 (prop=0, never flagged) are unaffected; fail-open when the prop/shell can't be read. Adversarially reviewed — 0 regressions. 3 files (Platform, ClusterService, ClusterManager); no daemon protocol change; lint 0/0.)
        // 563 = 1.6.122-beta (NEW: rolling screenshot recorder for the bug reporter — so a report can show what the screens actually displayed at the problem moment, e.g. "cluster black" vs "app stuck on a confirm screen" (motivated by INC-20260715-213145 where znav sat on its DLConfirm screen). While a projection is active, the recorder captures a JPEG of the CLUSTER and the main display every ~15s into a self-cleaning ring buffer in /data/local/tmp. The cluster is a virtual display, so `screencap -d N` can't grab it (silently falls back to display 0); instead a new uid-2000 daemon verb MirrorDaemon.TRANSACT_CAPTURE_DISPLAY mirrors the cluster layerStack into an ImageReader (same SurfaceControl primitives as the working visible mirror) and encodes a JPEG. Self-cleaning is enforced IN THE DAEMON right after each write (keep ≤12 newest + drop >5min), so the bound is transport-independent and can never grow even if the app-side ADB-TCP prune drops. At send time the bug wizard asks — per send, not persisted (H3 privacy pattern) — whether to attach the recent shots; only on consent are they pulled off-device (via the daemon, A13-safe), zipped with the report, and uploaded, then the device-side originals are wiped. A Settings switch (default ON for beta; wipes shots when turned off) gates the whole thing. Shots are deliberately NOT wiped when projection stops (a tester often stops a broken projection THEN files the report) — they self-clean via the daemon bound + a keeper-heartbeat max-age prune. New privileged verb is behind the existing uid-2000 caller gate. Adversarially reviewed (3 fixes: daemon-side prune, dedicated capture lock so a slow capture can't stall the visible mirror, Activity-lifecycle guard in the bundle thread). Consent/privacy verified: no path uploads shots without the user opting in. 8 files + a new ClusterShotRecorder + consent strings in all 13 locales; lint 0/0.)
        // 564 = 1.6.123-beta ("unsupported nav app" diagnostic in MapNotificationListenerService. Field report INC-20260715-161802: a DL3 tester reported "no arrow in HUD" (category HUD-Navigation) — the report showed DashCast HAD notification access + its listener enabled, but the foreground nav app was com.telenav.app.arp (Telenav, the EU OEM nav). DashCast's HUD nav only parses Google Maps / Maps ReVanced / Waze notifications, so isNavPackage() bailed at the top of onNotificationPosted → no parse, no arrow, and (pre-fix) total silence in the report, making the cause impossible to see. Now, when a notification comes from a KNOWN unsupported nav app (Telenav/SealNav/AMap/Baidu/Yandex, prefix-matched) or any app whose notification is category=navigation, we write to the DashCast journal — hence into every bug report — "NAV UNSUPPORTED app=<pkg> — DashCast HUD nav only reads Google Maps / Maps ReVanced / Waze". Throttled to once per ~30 s per app so a "no arrow" report always carries a RECENT self-explanatory line without flooding. Behaviour is otherwise unchanged: unsupported notifications are still dropped exactly as before; supported apps parse identically. No daemon protocol change; assembleRelease + lint 0/0.)
        // 565 = 1.6.124-beta (auto-start the configured app on the cluster AT BOOT, headless — the tester wanted Waze at startup without opening DashCast, INC-20260716-091016, Seal U DMi. Two fixes. (1) HEADLESS BOOT AUTO-LAUNCH: BootReceiver already auto-activated the PROJECTION at boot but never launched the app — the app-launch lived only in MainActivity (getAutoLaunchPkg → tryExecutePendingAutoLaunch), so nothing appeared until the user opened DashCast. Now BootReceiver passes EXTRA_BOOT_AUTOLAUNCH to ClusterService, which arms the configured app in onStartCommand and launches it onto the cluster in onDashboardDisplayConnected once the display is up — no MainActivity needed. Standalone-app only: gated on !isLayoutAutoStartConfigured() (mirrors MainActivity — the Layout owns startup for layout users; a single-app launch would make the layout's ensureDaemon abort). Double-launch guard: on success ClusterService sets a static sBootLaunchedPkg; when MainActivity later opens, onSendToDashboard ADOPTS that app (shows the mirror) instead of relaunching — a relaunch would force-stop the running nav. sBootLaunchedPkg is consume-once (cleared on first adopt) + cleared on cluster disconnect so it can never latch and suppress a legitimate later relaunch. (2) LAUNCH NPE LAST-RESORT FIX: on this car the FREEFORM launch on the fission display throws the WindowManager NPE (ActivityStack.getBounds() on null) and both daemon + app-side paths failed. cleanFissionStacks removes the zombie (1.6.114 fix works: removed=1) but the freeform stack creation still NPEs. The last-resort `am start` WITHOUT --windowingMode existed but only ran when `am` printed an error — here attempt 2 reported started=true yet landed no task, so the last-resort was skipped and the launch FAILED. Now it triggers on the ACTUAL outcome: after polling, if no task was discovered, retry without --windowingMode (app lands fullscreen on the cluster, visible) and poll again; runs at most once (triedPlain). Extracte