        // 548 = 1.6.107-beta (boot / auto-launch now resolves FAVORITED apps. On DL3 (6125f, INC log byd_log_20260705_175226) a user enabled boot projection with Waze as their FAVORITE app and Waze never launched. Root cause: MainActivity.tryExecutePendingAutoLaunch resolved the target from the UI grid AppListCoordinator.getApps(), but AppListCoordinator.deliver() splits favorites into a separate strip → getApps() holds NON-favorites only → a favorited auto-launch/boot target was never found → logged "deferred: app list not ready yet" even after the 43-app list loaded → never launched; the DisplayStatePoll then saw no process for the restored cluster pkg and cleared the cluster state. Fix: new AppRepository.findByPackage() resolves against the FULL cached list (favorites INCLUDED); tryExecutePendingAutoLaunch uses it, keeping the grid as a fallback. Fixes ANY favorited app set as auto-launch / boot projection, not just Waze. App-list logic only; no daemon/protocol change; DL3/DL5 unaffected; lint 0/0.)
