apply plugin: 'com.android.application'

android {
    signingConfigs {
        // BYD signature required to access bydauto system APIs
        bydPlatform {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('./keystore/platform.keystore')
            storePassword 'android'
        }
    }

    // La Seal EU tourne sur Android 10 (API 29) — DiLink 3.0
    // compileSdk bumpé à 33 pour pouvoir utiliser Material 3 (com.google.android.material 1.9.x).
    // targetSdkVersion reste à 29 → comportement runtime inchangé sur la Seal.
    compileSdkVersion 33
    // buildToolsVersion omis : AGP 7.4.2 utilise automatiquement 30.0.3

    defaultConfig {
        applicationId "com.byd.dashcast"
        minSdkVersion 28
        targetSdkVersion 29
        // Public versionName bumped to 1.2.30 for the LOT 2 audit cleanup:
        //   - ClusterInputForwarder.injectKey direct path: route to cluster display
        //     (was missing setDisplayId() on the non-daemon path; Back/Home went to
        //      display 0 instead of the cluster).
        //   - SysInfoActivity.saveReport: FileWriter on ExecutorService (no UI ANR).
        //   - SysInfoActivity.colorizeReport: 8 Pattern.compile() pre-compiled
        //     as static final (per-render allocations gone).
        //   - SysInfoActivity.pidOf: waitFor(2s) + destroyForcibly (anti-hang on
        //     ROMs where pgrep is missing or blocked).
        //   - FloatingRemoteButton: track quick-switch dialog and dismiss in
        //     onDestroy (no leaked overlay window on service teardown).
        //   - DiagActivity.mSnifferFile: volatile (cross-thread read by exporter).
        //   - MainActivity/KeyboardBridge: isFinishing/isDestroyed guards on
        //     async runOnUiThread lambdas (no NPE after teardown).
        //   - WelcomeActivity.setLanguageButton: defensive null-check on findViewById.
        //   - MirrorDaemon.broadcastBinder: signature-protected receiverPermission
        //     (other apps can no longer intercept the daemon IBinder broadcast).
        versionCode 226
        versionName "1.2.30"
    }

    buildTypes {
        debug {
            // Platform signature is mandatory even in debug builds for BYD permissions
            signingConfig signingConfigs.bydPlatform
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bydPlatform
        }
    }

    // Ignore les erreurs de lint sur les permissions BYD non connues du SDK standard
    lintOptions {
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/*.kotlin_module'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "DashCast-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

    // No resolutionStrategy.force needed with these API-29-compatible versions.

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Android 10 era versions (API 29) — minCompileSdk ≤ 29
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Material Components (Material 3) — fournit Theme.Material3.*
    // 1.9.0 = dernière version compatible compileSdk 33.
    implementation 'com.google.android.material:material:1.9.0'

    // dadb — pure-JVM ADB client (same library used by Overdrive)
    implementation 'dev.mobile:dadb:1.2.7'
}
