        // v1.2.45-beta (build 303) — Main "Compact apps panel" mode.
        //   - New Settings toggle "Mode compact (liste apps étroite)" (default
        //     OFF, historical 5-col layout preserved → zero regression for
        //     users who don't enable it). Pref: PREF_COMPACT_APPS_PANEL.
        //   - When ON: the left apps column on MainActivity is narrowed
