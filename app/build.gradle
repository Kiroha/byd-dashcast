        // 553 = 1.6.112-beta (ROOT CAUSE of "App not shown" on the cluster, INC-20260714-215700, DiLink 3.0/Waze — four fixes. (A) cleanFissionStacks HAS NEVER REMOVED A SINGLE STACK, on any car, since it was written: it read windowingMode/activityType as PUBLIC FIELDS of ActivityManager.StackInfo (Android 10) / RootTaskInfo (Android 12) — those fields do not exist, the values live in configuration.windowConfiguration — so every stack was logged "wm=-1 at=-1 (unreadable, defensive keep)" and the verb was a silent no-op (confirmed: removed=0 in 17/17 on-car bug reports). Consequence: a stale split-screen-primary stack (stackId=5, 0 tasks) survived on the fission display, and `am start-activity --windowingMode 5 --display 1` then threw NPE inside system_server (ActivityStack.getBounds() on null, at ActivityStack.onConfigurationChanged ← setWindowingMode ← ActivityStack.<init> ← ActivityDisplay.createStackUnchecked) — no stack, no activity, nothing on the cluster. New readWindowingMode()/readActivityType() resolve through 4 routes (getter on the info object; configuration.windowConfiguration getter; textual mWindowingMode=/mActivityType= parse; legacy field), and cleanFissionStacks now removes every non-fullscreen, non-home stack that holds ZERO tasks (the stale split-screen one included) while KEEPING fullscreen, home and every task-holding stack — emptiness is a necessary condition for removal, so it can never tear down a running projection: on DL3 the live projection legitimately sits in a SPLIT_SCREEN_PRIMARY stack after a resize (moveAndResize → setTaskWindowingModeWithBounds drives setCustomTaskWindowingModeSplitScreenPrimary with modes {5,3,0}), and split mode launches the 2nd app while the 1st stays live. The INC-20260714 zombie has 0 tasks, so it is still destroyed. (B) daemonLaunchSync now HONOURS the daemon's own verdict: the cascade polls for the task and appends "FAIL: no task discovered" when none appeared; that verdict is authoritative and wins over the am transcript, which read like a success ("Starting: Intent") on a launch system_server had thrown away → 1.6.110 reported ok=true, registered Waze as projected, mirrored an EMPTY display and suppressed the app-side fallback. The DL5.1 benign-NoSuchMethodException fix (INC-20260706-070423) is preserved: "exception" is still not a failure signal. (C) the daemon's own start-success test only looked for "Error:" — an am transcript that says "Exception occurred while executing" is now correctly a FAILED start, so the fallback attempts actually run. (D) new last-resort `am start-activity` WITHOUT --windowingMode 5, run only after both freeform attempts failed: the app lands in the display's default fullscreen stack and is at least VISIBLE on the cluster instead of nothing. DL4/DL5.1 unaffected (their windowingMode-5 path succeeds and never reaches D); lint 0/0.)
        // 554 = 1.6.113-beta (RICHER, TRANSLATED HUD bug reports so testers' NO answers are finally analysable. Two parts, HudDiagActivity only. (1) MAX LOGS in every bench + confirm zip: 03_logcat.txt (recent unfiltered logcat, bounded to ~400KB for the binder parcel), 04_hud_state.txt (the HUD's ACTUAL switch + display-mode from the BYDAuto push-feedback listener — canListenStart() is now registered at onCreate so the OEM push at nav-start is captured; get() is push-only so drain() is the only truth: 0x38B0001C=switch 1on/2off, 0x38B0000D/0x42E00008=display mode 1..6 → we can finally tell a HUD-off / speed-only-mode NO apart from a real render failure), 05_device_state.txt (foreground app + activities-per-display + displays + recent avc denials via dumpsys through the uid-2000 daemon). (2) STRUCTURED, TRANSLATED result choices: the CAN→HUD bench result is now a 5-option picker in the tester's language (arrow-correct / arrow-wrong-direction / distance-text-but-no-arrow / nothing / other+free-text) instead of a French OUI/NON; confirm buttons (Yes/No/Skip) translated too. Each choice records a CANONICAL ENGLISH tag into the zip so analyze_hud.py still counts YES vs NO/PARTIAL AND gets a machine-readable sub-reason. New R.string.hud_bench_* / hud_confirm_* / hud_report_send added in ALL 13 locales (values/ FR default + ar be de en es it kk pl ru tr uk uz); MissingTranslation 0. Only HudDiagActivity.kt + the 13 strings.xml changed; no daemon protocol change; no behaviour change outside the dev diag screen; DL3/DL4/DL5/AAOS prod paths untouched; assembleRelease + lint 0/0.)
        // 555 = 1.6.114-beta (ships the four cluster-launch fixes of build 553, which was never released: the 1.6.113 HUD bug-report work landed on top of them, so this build carries BOTH. No code change of its own — version bump only. See the build-553 entry above for the full root-cause write-up of INC-20260714-215700.)
        // 556 = 1.6.115-beta (the in-app BUG REPORTER — the navrail 🐞 button, the only channel a regular user has now that DL3 HUD turn-by-turn is in production — becomes structured + HUD-aware. (1) CATEGORY PICKER: a 9-option radio group at the top of BugReportActivity (HUD navigation / cluster-dashboard display / screen mirroring / app launch / voice / Wi-Fi-hotspot / OTA update / crash-freeze / other), so a user can say WHICH area their bug is about. The label is shown TRANSLATED in all 13 locales (new R.string.bug_cat_* in values/ FR + ar be de en es it kk pl ru tr uk uz; MissingTranslation 0), but a CANONICAL ENGLISH tag is written into the report caption ("Category: HUD navigation") for triage. (2) HUD FIRMWARE in the dump: BugReportCapture now greps getprop for inswver (the SX<NNN> HUD MCU firmware that pins arrow-capability) + HUD props. (3) LIVE HUD STATE: ProxyKeeperService now keeps the BYDAuto push-feedback listener registered app-wide (off-thread, guarded, idempotent, re-armed after a daemon reconnect) so the report carries a real HUD STATE section (canListenDrain: 0x38B0001C switch 1on/2off, 0x38B0000D/0x42E00008 display mode 1..6) — this state is push-only (get() returns 0), so a cold general report could not read it before. The existing dump already captured CPU/mem/logcat×3/displays/car_service/SurfaceFlinger/daemon-logs, so this only adds the HUD-specific gaps. Files: BugReportActivity.kt, BugReportCapture.java, ProxyKeeperService.java, activity_bug_report.xml, 13 strings.xml. No daemon protocol change; the listener registration is guarded and cannot crash the daemon; DL3/DL4/DL5/AAOS prod paths unaffected; assembleRelease + lint 0/0.)
        // 557 = 1.6.116-beta (CORRECTION of 1.6.115: the category picker went to the WRONG screen. The navrail 🐞 button and the floating button both launch BugWizardActivity (a Category→App→Issue wizard that has REPLACED BugReportActivity since 1.5.4 — BugReportActivity is declared but never started), so the RadioGroup I added to BugReportActivity was dead code the user could never reach. Fixes: (1) REVERTED that dead picker — the BugReportActivity layout RadioGroup, its Kotlin wiring, and the 13× bug_cat_* strings are removed; BugReportActivity is back to its original Title/Steps/Result form. (2) Put categories where they belong — the WIZARD: added a new "HUD navigation" category (first, 🧭) with its own bug_issues_hud list (no arrow / wrong direction / wrong distance-road / HUD stays off / arrow frozen / other), translated in all 13 locales; CAT_EMOJIS + CAT_KEYS + ISSUE_ARRAYS kept in lockstep with the bug_categories array. (3) Made the wizard reports ANALYSABLE across languages: the wizard now also writes a canonical "CategoryKey:" (stable English key: hud/mirror/app/…) alongside the translated "Category:" label, so incident triage can group them (the label alone is Spiegelung/Yansıtma/Mirror, ungroupable). The 1.6.115 HUD-capture wins are UNAFFECTED and correct — BugReportCapture (inswver + HUD STATE) and the ProxyKeeperService always-on listener already flow into the wizard via BugReportCapture.capture(). Off-repo: hud_reports/analyze_incidents.py parses the wizard reports (Category/CategoryKey/App/Issue/HUD STATE/inswver). No daemon protocol change; prod paths untouched; assembleRelease + lint 0/0; MissingTranslation 0.)
        // 558 = 1.6.117-beta (two HUD nav fixes from field report INC-20260715-125508, DL3/SX245/Maps-ReVanced, "Flèche figée"/frozen arrow. (1) STALENESS WATCHDOG in HudController: the prod guidance path is on-change/dedup with NO periodic re-push, so when a nav app's notifications stop flowing (nav paused/ended without a clean stop, a parse gap, Maps backgrounded) the last CAN arrow stays LATCHED on the HUD → a frozen arrow. New watchdog (single daemon scheduler thread, ticks every STALE_MS/2) clears the HUD via closeNavigation() after STALE_MS=12s with no update — mirrors OpenBYD's staleness-close. update/close/tick are now synchronized on the singleton so the watchdog and the notification-writer thread never race; appContext is the process-scoped app context (safe to retain). (2) NAV PARSE diagnostic in MapNotificationListenerService: we render arrows correctly (video-proven output) but had NEVER verified the INPUT — reading the maneuver direction from a real Google Maps/Waze notification. Now, per distinct (icon|road) maneuver (deduped so it never floods the ~1Hz distance ticks), we write to the DashCast journal — hence into every bug report — the RAW notification (small-icon resource entry name + title/text/bigText) alongside the PARSED output (icon id + which source resolved it: resource / text-keyword / straight-default). One real Maps drive now yields ground truth: what the notification said vs the arrow we produced, so the 13-language text table + icon-resource mapping can finally be validated/fixed. No daemon protocol change; prod paths otherwise unchanged; DL3-gated; assembleRelease + lint 0/0.)
        // 559 = 1.6.118-beta (Delta hardening — 11 findings fixed in the code ADDED since the 1.6.108 hardening pass (windshield HUD turn-by-turn, HotspotKeeper, daemon-launch rework, applied perf patches). A verified re-audit found ZERO regressions of the prior 30 fixes. Each fix was read-confirmed against current code + built clean (lint 0/0), one commit per fix. CORRECTNESS: daemonLaunchSync ANDed its authoritative daemon verdict with an am-transcript keyword the daemon never emits on success, so a task-PROVEN cluster launch was reported FAILED — it dropped the app's tracking (green bar / resize) and forced the DL5-denied app-side fallback; the daemon's poll verdict is now authoritative (D1). launchOnDashboardWithBounds still fire-and-forgot launchViaDaemonForce and posted unconditional success — routed through the same verdict-checked daemonLaunchSync (D6). cleanFissionStacks treated an UNREADABLE task list (getChildTaskIds()==null) as 0 tasks and could removeStack() a LIVE projection (blank cluster/HUD) — now a defensive keep (D2). RESOURCE/RELIABILITY: HotspotKeeper relaunched TetherFi as a foreground Activity every 30s forever — added a give-up ceiling that resets on an UP probe (D3) + a staleness guard so probeInFlight can't stick true and silently kill the keeper (D4). HudController's staleness-watchdog ScheduledExecutorService is now shut down when nav stops instead of leaking a daemon thread on the static singleton (D7), and its stale-close no longer runs a ~23s blocking daemon bootstrap under the `this` monitor (D8). ProxyKeeperService arms the HUD listener on a reused serial executor instead of a raw Thread per 10s heartbeat (D9). BugReportCapture.hudStateSnapshot no longer blocks the offline-report worker on a down daemon (D5). HudDiagActivity restores its diag UI in a finally when bg work throws (D10). MainActivity's resize-affordance probe reaches the Activity via WeakReference so it can't retain a destroyed instance (D11). All daemon-down / reconnect paths reuse the F5/F6 non-blocking-reconnect opt-out. No daemon protocol change; behaviour preserved; DL3/DL5 unaffected; lint 0/0.)
        // 560 = 1.6.119-beta (BUG REPORT fixed on Android 13 / DL5.1. On A13 the shell (uid 2000) is denied write access to the app's /sdcard/Android/data/<pkg> dir by scoped storage, so the report's shell dump redirected there failed with EACCES and only the journal was delivered — "[report body build failed: FileNotFoundException … EACCES]" (INC-20260715-191229, D50F_LC/trinket/A13, @kodai_matsumoto). No filesystem path is shared between the app (uid 10xxx) and the shell (uid 2000) on A13, so the body must come back through the shell channel. On SDK_INT>=33 the dump is now staged in /data/local/tmp (uid 2000 owns it), `cat`-ed back to stdout in the SAME shell round-trip (the app can't read /data/local/tmp on A13 but the shell can), and finish() writes the final report into the app's own external dir (which the app CAN write — the journal-only fallback already proved that). finish() gains a preReadShellBody param and NEVER reads the external file on A13 (that readFile was the EACCES site). New AdbLocalClient.executeShellWithResultUnlogged: same as executeShellWithResult but logs only cmd length + byte count, so the ~1 MB body doesn't bloat the journal that is itself embedded in the report. dadb.getAllOutput() has no size cap so the full body returns. Gated to A13 precisely — A10 (DL3/DL4) keeps the direct-external-write fast path unchanged (stageInTmp=false), zero behaviour change; widen to >=30 if an A11/A12 unit ever reports the same EACCES (uid 2000 always owns /data/local/tmp). Two files (BugReportCapture, AdbLocalClient); no daemon protocol change; lint 0/0.)
        // 561 = 1.6.120-beta (Follow-up audit pass — a regression review of the 1.6.118 delta fixes + a fresh SECURITY lens (the concurrency/lifecycle audits never ran one) found 8 issues, all fixed here, one commit each, lint 0/0. REGRESSIONS of my own 1.6.118 HotspotKeeper changes: the D3 give-up ceiling was a PERMANENT latch — the keep-alive stopped recovering forever because the counter only reset on an UP probe, which can never happen once the keeper stops starting TetherFi — now a self-healing BACKOFF (retries after GIVE_UP_COOLDOWN) + a reset on the pref off→on edge (R1); the D4 stuck-probe reset could let a stale ShellGateway callback clobber a newer probe's flag / reset the counter on old state — now each probe carries a generation token (R2). PRIVACY / data-hygiene (these all flow into the journal → Telegram bug reports): raw Google Maps/Waze nav content (destination / current road / ETA = location PII) redacted to lengths + a road-found flag (H1); the LLM voice assistant's raw response + spoken reply (conversation PII) no longer logged — only the non-PII cmd/pkg (H2); the HUD raw recorder's device-wide `logcat -b all` now requires explicit consent before auto-uploading (the capture itself is unchanged — its RE purpose needs the full log) (H3). DAEMON SECURITY (every change is SAFE-BY-DESIGN — fall-open on unresolved uid / best-effort addService / null-fallback cross-check — so it can NEVER break the daemon connection, including on unsigned DL5.1 where the shell does not hold the app's signature permission, and across the update transition where a pre-change daemon is still running): MirrorDaemon + ProxyDaemon now gate onTransact on the caller uid (only the app + system + the daemon's own uid may drive the privileged input-injection / trusted-display / TXN_EXEC-shell-as-uid-2000 verbs — enforceInterface is a public constant, NOT authentication) (S1); and the app authenticates the DAEMON_READY / PROXY_CONNECTED broadcast binders against the daemon's global-ServiceManager registration (only uid-2000/system can addService — SELinux blocks untrusted apps — and BinderProxy identity is stable), so a co-installed app can no longer hijack the daemon connection with a spoofed broadcast binder; relaying the real binder is harmless (it IS the real daemon) (S2, S3). Deliberately NOT using a signature-permission gate on the receivers — that would drop the daemon's own broadcast on non-platform-signed ROMs. No daemon protocol change; behaviour preserved; DL3/DL5 unaffected.)
        // 562 = 1.6.121-beta (DL3 single-OS cluster: stop the silent 20s activation loop + tell the user. On a single-OS DL3 (ro.build.system.fission_single_os=1) the cluster is rendered natively (Qt/fission_service[ivi]) and NO projectable Android VirtualDisplay is ever created — proven decisive by mNextNonDefaultDisplayId=1 for the whole boot + AutoContainer replying "no AutoContainerNative" (INC-20260715-140107 / -140551, @Kadir000000). DashCast looped the full 30→16→35 activation → 20s timeout, repeatedly, showing nothing with no explanation. The existing single-OS guards (onSendToDashboard, startNativeProjection) were INEFFECTIVE because isClusterSingleOs() read the prop via in-process SystemProperties.get, which returns "" on these cars (the app's SELinux domain can't read the vendor prop — the uid-2000 shell CAN, which is why the bug report's getprop shows [1]). Fix: (1) Platform gains a persisted runtime single-OS verdict — isClusterSingleOs() now ORs the in-process read with a flag set by noteClusterSingleOsDetected() and loaded by primeClusterSingleOs(); (2) ClusterService.onCreate reads fission_single_os via the uid-2000 shell (getprop) and, on "1", persists the verdict, so the guards fire before wasting an activation cycle; (3) ClusterManager.activateClusterDisplay short-circuits to onDisplayTimeout when DL3+single-OS, and ClusterService shows the "Projection cluster indisponible" notification (startNativeProjection guard + onDashboardDisplayDisconnected) instead of the generic "disconnected". The flag is set ONLY from the AUTHORITATIVE, race-free fission_single_os=="1" read — deliberately NOT from a transient "no AutoContainerNative" reply, which can occur in a boot race on a WORKING 1-for-2 and would permanently disable it. STRICT: every path gates on isDiLink3, so DL5.1 (also single-OS) and a 1-for-2 DL3 (prop=0, never flagged) are unaffected; fail-open when the prop/shell can't be read. Adversarially reviewed — 0 regressions. 3 files (Platform, ClusterService, ClusterManager); no daemon protocol change; lint 0/0.)
        // 563 = 1.6.122-beta (NEW: rolling screenshot recorder for the bug reporter — so a report can show what the screens actually displayed at the problem moment, e.g. "cluster black" vs "app stuck on a confirm screen" (motivated by INC-20260715-213145 where znav sat on its DLConfirm screen). While a projection is active, the recorder captures a JPEG of the CLUSTER and the main display every ~15s into a self-cleaning ring buffer in /data/local/tmp. The cluster is a virtual display, so `screencap -d N` can't grab it (silently falls back to display 0); instead a new uid-2000 daemon verb MirrorDaemon.TRANSACT_CAPTURE_DISPLAY mirrors the cluster layerStack into an ImageReader (same SurfaceControl primitives as the working visible mirror) and encodes a JPEG. Self-cleaning is enforced IN THE DAEMON right after each write (keep ≤12 newest + drop >5min), so the bound is transport-independent and can never grow even if the app-side ADB-TCP prune drops. At send time the bug wizard asks — per send, not persisted (H3 privacy pattern) — whether to attach the recent shots; only on consent are they pulled off-device (via the daemon, A13-safe), zipped with the report, and uploaded, then the device-side originals are wiped. A Settings switch (default ON for beta; wipes shots when turned off) gates the whole thing. Shots are deliberately NOT wiped when projection stops (a tester often stops a broken projection THEN files the report) — they self-clean via the daemon bound + a keeper-heartbeat max-age prune. New privileged verb is behind the existing uid-2000 caller gate. Adversarially reviewed (3 fixes: daemon-side prune, dedicated capture lock so a slow capture can't stall the visible mirror, Activity-lifecycle guard in the bundle thread). Consent/privacy verified: no path uploads shots without the user opting in. 8 files + a new ClusterShotRecorder + consent strings in all 13 locales; lint 0/0.)
        // 564 = 1.6.123-beta ("unsupported nav app" diagnostic in MapNotificationListenerService. Field report INC-20260715-161802: a DL3 tester reported "no arrow in HUD" (category HUD-Navigation) — the report showed DashCast HAD notification access + its listener enabled, but the foreground nav app was com.telenav.app.arp (Telenav, the EU OEM nav). DashCast's HUD nav only parses Google Maps / Maps ReVanced / Waze notifications, so isNavPackage() bailed at the top of onNotificationPosted → no parse, no arrow, and (pre-fix) total silence in the report, making the cause impossible to see. Now, when a notification comes from a KNOWN unsupported nav app (Telenav/SealNav/AMap/Baidu/Yandex, prefix-matched) or any app whose notification is category=navigation, we write to the DashCast journal — hence into every bug report — "NAV UNSUPPORTED app=<pkg> — DashCast HUD nav only reads Google Maps / Maps ReVanced / Waze". Throttled to once per ~30 s per app so a "no arrow" report always carries a RECENT self-explanatory line without flooding. Behaviour is otherwise unchanged: unsupported notifications are still dropped exactly as before; supported apps parse identically. No daemon protocol change; assembleRelease + lint 0/0.)
        // 565 = 1.6.124-beta (auto-start the configured app on the cluster AT BOOT, headless — the tester wanted Waze at startup without opening DashCast, INC-20260716-091016, Seal U DMi. Two fixes. (1) HEADLESS BOOT AUTO-LAUNCH: BootReceiver already auto-activated the PROJECTION at boot but never launched the app — the app-launch lived only in MainActivity (getAutoLaunchPkg → tryExecutePendingAutoLaunch), so nothing appeared until the user opened DashCast. Now BootReceiver passes EXTRA_BOOT_AUTOLAUNCH to ClusterService, which arms the configured app in onStartCommand and launches it onto the cluster in onDashboardDisplayConnected once the display is up — no MainActivity needed. Standalone-app only: gated on !isLayoutAutoStartConfigured() (mirrors MainActivity — the Layout owns startup for layout users; a single-app launch would make the layout's ensureDaemon abort). Double-launch guard: on success ClusterService sets a static sBootLaunchedPkg; when MainActivity later opens, onSendToDashboard ADOPTS that app (shows the mirror) instead of relaunching — a relaunch would force-stop the running nav. sBootLaunchedPkg is consume-once (cleared on first adopt) + cleared on cluster disconnect so it can never latch and suppress a legitimate later relaunch. (2) LAUNCH NPE LAST-RESORT FIX: on this car the FREEFORM launch on the fission display throws the WindowManager NPE (ActivityStack.getBounds() on null) and both daemon + app-side paths failed. cleanFissionStacks removes the zombie (1.6.114 fix works: removed=1) but the freeform stack creation still NPEs. The last-resort `am start` WITHOUT --windowingMode existed but only ran when `am` printed an error — here attempt 2 reported started=true yet landed no task, so the last-resort was skipped and the launch FAILED. Now it triggers on the ACTUAL outcome: after polling, if no task was discovered, retry without --windowingMode (app lands fullscreen on the cluster, visible) and poll again; runs at most once (triedPlain). Extracted pollForTaskId()/startPlainOnDisplay() helpers. Also folds in the earlier zip-naming fix (bug-report bundles are named byd_bugreport_*.zip, not bugbundle_*, so the Telegram pull filter matches). Adversarially reviewed — 2 findings fixed (sBootLaunchedPkg latch, missing layout guard); DL3/DL5 that already work are unchanged. Lint 0/0.)
        // 566 = 1.6.125-beta (STEER testers from the R&D diagnostic bench to the LIVE production HUD nav. Now that the windshield HUD turn-by-turn works in production (real Google Maps / Waze notification → HudController → CAN), testers kept sending hud_bench/hud_confirm zips from the Diagnostic menu instead of driving the real feature + reporting via the navrail 🐞 button. Two nudges in HudDiagActivity, both DL3-dev-screen but TRANSLATED in all 13 locales (values/ FR + ar be de en es it kk pl ru tr uk uz; MissingTranslation 0): (1) a prominent banner at the TOP of the screen (R.string.hud_prod_banner, bold + translucent-blue background) — "HUD navigation is now LIVE; to help, drive with Google Maps/Waze and report via the 🐞 button; the tools below are R&D, use only when asked"; (2) an AlertDialog nudge (R.string.hud_prod_nudge) shown right after every bench/confirm upload — "Sent, but the real test now is to navigate with Maps/Waze and report via the 🐞 button". The diagnostic tools are KEPT (still needed for a new firmware / on request) — this only informs. No behaviour change to the bench/confirm/CAN paths; no daemon protocol change; assembleRelease + lint 0/0.)
        // 567 = 1.6.126-beta (headless LAYOUT auto-start at boot. INC-20260716-201008: a DiLink 3 tester with a favourite multi-app Layout + auto-boot enabled got the cluster projection ON but NO apps — because the boot flow only started the classic ClusterService projection; the Layout auto-start lived only in MainActivity.onCreate → FissionOrchestrator.maybeAutoStartOnAppLaunch (the standalone-app headless boot of 1.6.124 explicitly deferred layout to MainActivity). Now BootReceiver branches: when isLayoutAutoStartConfigured() (ClusterPrefs.isFissionAutoLayout && DaemonConfig.isFissionModeEnabled && LayoutPrefs.getFavoriteLayout!=null) it calls FissionOrchestrator.maybeAutoStartOnAppLaunch(appCtx) — the SAME fully-headless method MainActivity uses (headless Callbacks "no UI to ask") which activates projection AND launches every bound slot app itself — and does NOT start the classic ClusterService projection (that would trip the layout's isClassicProjectionActive conflict guard → "projection on, no apps", the exact symptom). Fired via sMain.postDelayed 3s (daemon pre-warm head start) inside the existing goAsync pending/releaseOne counter; the orchestrator's ensureDaemon polls up to ~8s so it self-heals if the daemon is still cold. MainActivity's later call to the same method no-ops (sAutoStartFired one-shot). Non-layout users unchanged (classic ClusterService + EXTRA_BOOT_AUTOLAUNCH single-app path). Note on tiling: a layout gives EACH slot app its OWN slot-sized virtual display (FissionClient.activateLayout → slot.displayId per slot), so the 1.6.124 fix-2 fullscreen last-resort fills the SLOT vd, not the whole cluster — multi-app tiling is preserved. Adversarially reviewed — no blocking defect (one noted low-severity: sAutoStartFired latches on the boot attempt; a transient cold-boot failure isn't auto-retried by MainActivity, but the manual "Launch layout apps" button still works — strictly better than before). Reuses existing, MainActivity-proven code; 1 file (BootReceiver); no daemon protocol change; lint 0/0. Skips versionCode 566 to stay above a tester's local 1.6.125 build.)
        // 568 = 1.6.127-beta (delta-audit pass over the 1.6.121→1.6.126 work — headless boot auto-launch, screenshot recorder, cluster/single-OS launch fixes. Multi-agent regression + new-bug/privacy review: the prior daemon security gates (S1/S2/S3 caller-uid fail-open + ServiceManager cross-check) and H1 nav-content redaction all SURVIVED intact — the new TRANSACT_CAPTURE_DISPLAY verb is dispatched AFTER the S1 caller-uid gate (not bypassable by a co-installed app), 0 regressions. Three LOW findings fixed, one commit each, no HIGH/MED: (1) PRIVACY — maybeLogUnsupportedNav() (1.6.125) logged `NAV UNSUPPORTED app=<pkg>` into the journal→every bug report→Telegram; the category=navigation branch fires for ANY installed app that posts a nav notification, so the raw package leaked the driver's app inventory off-device. Known-list packages (our own hardcoded KNOWN_UNSUPPORTED_NAV, e.g. Telenav — the actual field-report signal) stay named; unknown nav-category apps now log a coarse non-reversible SHA-256 marker (pkgHash=) instead of plaintext. H1 title/text/roadName redaction unchanged. (2) CLUSTER UX — the sBootLaunchedPkg consume-once guard (1.6.124) adopted the app as 'already on cluster' and showed the mirror WITHOUT relaunching whenever pkg matched + displayId>0, never confirming the boot-launched task was still present; if it had left the cluster (crash / OEM nav takeover / task moved) while the display stayed up, the first post-boot tap showed a blank/stale mirror (self-healed next tap). Now the mirror-only adoption is gated on an async presence check (new ClusterService.isPackageRunning → findRunningTaskId on sMoveTaskExecutor, posts back on main thread — NO main-thread I/O, no daemon change): present → mirror only (unchanged fast path, still avoids the INC-20260716-091016 nav recreation); gone → fall through to a normal launch. Latch consumed up front so the re-entry takes the normal path. (3) DAEMON RESOURCE — captureLayerStackToJpeg() (screenshot recorder, ~15s cadence) allocated a SurfaceControl.Transaction, applied it, but never closed it → native SurfaceComposerClient transaction reclaimed only on GC; now closed deterministically in the existing finally (all paths), same close() added after apply() in setupMirror(). Purely resource-lifecycle: NO binder/onTransact/caller-uid-gate/ServiceManager touched — the daemon connection path is byte-for-byte unchanged; close() is safe after apply() (display config already committed). assembleDebug + lintDebug 0/0; not pushed — tester validates before publish.)
        // 569 = 1.6.128-beta (resource/lifecycle hardening series after 1.6.127;
        // every confirmed fix is isolated in its own rollback commit and JVM/lint validated.)
        // 570 = 1.6.129-beta (INC-20260716-215316 / INC-20260716-215226:
        // compatible Layout task move + ordered, verified teardown before cluster restoration.)
        // 571 = 1.6.130-beta (INC-20260717-122902 / INC-20260717-175749:
        // automatic Layout owns startup + DL3 FREEFORM-stack NPE recovery before plain launch.)
        // 572 = 1.6.131-beta (INC-20260717-153708: Layout active indicators +
        // switchable tactile mirrors targeting each slot's real display/layer stack.)
        // 573 = 1.6.132-beta (INC-20260717-221007: D50F_LC physical-routing truth model,
        // native AutoContainer result codes, and guarded 1000/18 -> 16/35 diagnostic probe.)
        // 574 = 1.6.133-beta (proxy monitor consolidation, zero lint errors/warnings,
        // and low-risk baseline/overdraw layout measurement cleanup.)
        // 575 = 1.6.134-beta (full-application optimization audit: process-once startup
        // hygiene, batched shortcut discovery, typed task lookup, incremental Journal,
        // wake-word/voice hot-path reductions, screenshot pruning, and resize allocation cleanup.)
        // 576 = 1.6.135-beta (mirror diagnostics off the start critical path, race-safe
        // screenshot ownership, lifecycle-safe Hotspot probes, and lower voice telemetry cost.)
        // 577 = 1.6.136-beta (HUD arrow-capability GATE in the bug wizard, to stop noise reports that skew the debug. Too many "HUD navigation" bug reports come from cars whose HUD firmware cannot display turn arrows AT ALL — DashCast can never add arrows to such a HUD, so the report is worthless. When a user picks the "HUD navigation" category (CAT_KEYS == "hud"), BugWizardActivity now first asks (translated in all 13 locales): "Does your car's OWN built-in navigation already show turn arrows on the windshield HUD?" — ✅ Yes / ❌ No / ❓ I don't know. On "No" we explain there is nothing DashCast can fix and FINISH without sending anything. On Yes/Unknown the wizard continues as before and records "HudArrows: yes|unknown" in the report caption, so a report that DOES arrive is known to come from an arrow-capable HUD (⇒ a real DashCast issue, e.g. the CAN→HUD regression tracked separately). New R.string.bug_hud_gate_* / bug_hud_no_arrows_msg in values/ FR + ar be de en es it kk pl ru tr uk uz; MissingTranslation 0. Only BugWizardActivity.kt + the 13 strings.xml; no daemon/behaviour change elsewhere; assembleRelease + lint 0/0.)
        // 578 = 1.6.137-beta (dadb 2.0 transport timeouts, typed self-ADB health,
        // bounded proxy recovery, D50F diagnostics/report fallback, and live-Binder-safe routing.)
        // 579 = 1.6.138-beta (OTA proxy reconnect + safe /data/local/tmp staging,
        // PackageInstaller no-user-action request, and replacement-safe automatic relaunch.)
        // 580 = 1.6.139-beta (per-package fission rebound guardians, teardown-safe
        // protocol v21 cancellation, confirmed ADB timeout diagnosis, and detached MirrorDaemon start.)
        // 581 = 1.6.140-beta (HUD "no arrow" report self-diagnosis + nav-app gate. INC-20260718-114114:
        // a DL3 SX326 (arrow-capable) tester's "no arrow" report — like ~3/4 of HUD reports — is an
        // unsupported-nav case: the active nav is the OEM Telenav (binary NaviInfo AIDL, posts NO
        // notification), so DashCast's notification-driven HUD path has nothing to translate and the
        // 1.6.123 NAV-UNSUPPORTED log (fired only from onNotificationPosted) stays silent. P1: at HUD
        // report time, probe the running process list via the uid-2000 daemon (ps -A) for any
        // KNOWN_UNSUPPORTED_NAV (Telenav/AMap/Baidu/Yandex/Seal) and record "ActiveNav: <pkg>
        // (unsupported — no notification path)" in the caption → the report explains itself even though
        // Telenav never posts a notification. P2: the HUD bug wizard now also asks WHICH nav app the
        // user relies on (Maps/Waze/OEM/Other); OEM/Other are told DashCast only mirrors Google Maps or
        // Waze (their OEM nav already draws its own HUD arrows) and can bail instead of filing noise, or
        // report anyway (recorded as HudNavApp). Closes the gate blind spot where an arrow-capable
        // Telenav user truthfully answered "yes" and passed straight through. No new permission (reuses
        // BugWizardActivity's existing privileged-shell probe); +5 strings x13 locales; DL3-only path.)
        // 582 = 1.6.141-beta (HUD nav-status heartbeat — OEM fidelity B2. Gap analysis vs the
        // decompiled OEM AmapService.sendNavigateInfoToCAN showed the factory nav re-writes
        // INSTRUMENT_SEND_NAVI_STATUS (0x43E0003A) = active on EVERY guidance frame — its only
        // always-written register — whereas DashCast asserted it just once at nav-start
        // (ensureHudActive). A cluster that treats that register as a liveness heartbeat can drop the
        // guidance widget on a long step with no icon/distance change. HudController.updateNavigation
        // now re-asserts it on every update via CanBusController.sendNaviStatusHeartbeat() (a new
        // single-register batch that writes ONLY the status, NOT SETTING_NAVI_SCREEN_STATUS which the
        // OEM writes only at start). Additive, best-effort, DL3-only, does not touch the
        // video-confirmed icon/distance path. No daemon protocol change.)
        // 583 = 1.6.142-beta (two more OEM-fidelity HUD gains from the AmapService gap analysis,
        // both DL3-only, additive, and behind existing dedup — the video-confirmed icon/distance path
        // is untouched. G2 (ETA wall-clock): the OEM writes an EXPECTED_ARRIVE_* family (0x43F09010/
        // 18/20/28 = day/hour/minute/second) for the "arrive at HH:MM" clock, distinct from the
        // remaining-DURATION family we already send; DashCast now parses a bare HH:MM (best-effort,
        // RX_ETA_CLOCK) from the notification summary line and writes the ETA clock (day-code=today,
        // a notification carries none) via CanBusController.sendExpectedArrival, deduped on hh:mm.
        // G3 (roundabout exit): the parser only ever emitted a generic roundabout icon; it now reads
        // an exit number ("3rd exit"/"sortie 3", RX_ROUNDABOUT_EXIT) and promotes it to the OEM
        // exit-numbered icon (CCW 25-34 / CW 35-44, exit N = base+N), preserving handedness from the
        // resolved generic icon. HudNavigationData gained etaHour/etaMinute. No daemon protocol
        // change; on-car verification pending; honest ceiling (2nd maneuver, smooth countdown,
        // roundabout handedness, ETA day-code) unchanged per the gap analysis.)
        // 584 = 1.6.143-beta (P3: catch the REAL dominant cause of "no arrow on HUD" reports — no
        // route running. On-car evidence 2026-07-18 (reports 154029/174551 on 1.6.142, with rolling
        // screenshots): the tester answered "Waze" to the 1.6.140 nav-app gate and his HUD firmware IS
        // arrow-capable, so both existing gates correctly let him through — yet the cluster shots show
        // Waze parked on its idle "Dove andiamo?" screen at 0 km/h for the whole 100 s window, with
        // ZERO nav notifications and zero NAV PARSE. A nav app posts turn-by-turn notifications only
        // while actively guiding, so with no route started there is nothing for DashCast to translate.
        // MapNotificationListenerService now records whether a SUPPORTED nav frame was ever parsed
        // this process (sLastSupportedNavMs / hasSeenSupportedNav — single app process, no
        // android:process, so the static is shared); the HUD wizard checks it after a Maps/Waze answer
        // and, if none was seen, explains that opening the app is not enough and to start a route,
        // letting the user bail or report anyway. Every HUD report now carries "NavSeen: yes|no".
        // Also closes the diagnostic blind spot flagged in INC-20260718-114114: the report now dumps
        // `settings get secure enabled_notification_listeners`, so a revoked notification grant — which
        // looks EXACTLY like "the nav app posts nothing" — can finally be ruled out. +2 strings x13
        // locales. No daemon protocol change; no CAN behaviour change.)
        // 585 = 1.6.144-beta (fixes the 1.6.143 route gate, which an adversarial pre-release review
        // showed was net-harmful — 12 of 15 findings confirmed — plus the product bug it uncovered.
        // 1.6.143 was NEVER published; this supersedes it.
        // (a) IMPERIAL DISTANCES — the real prize. RX_DIST was metric-only (km|км|m|м), so in a UK/US
        // locale where Maps/Waze post "in 500 ft" / "0.5 mi" NO frame of an entire route could ever
        // parse: the HUD arrow never worked there AT ALL. Added mi/ft/yd (+ Italian "mt") with proper
        // conversion; alternation is longest-first and "25 min"/"45 мин" still cannot match, so
        // remaining-time is never misread as a distance (validated off-car, 17/17 cases).
        // (b) The gate no longer conflates three different causes. MapNotificationListenerService now
        // tracks, PER PACKAGE, both when a supported nav app POSTED guidance and when a frame fully
        // PARSED. "posted but never parsed" is a DashCast parser bug — the most valuable no-arrow
        // report there is — and is now sent straight through instead of being dismissed as "you never
        // started a route" (which is exactly what an imperial-locale driver would have been told).
        // (c) Missing notification access gets its own explanation instead of the false no-route
        // message — the report the 1.6.143 notification dump existed to enable was being cancelled.
        // (d) Recency window (30 min, generous because the wizard is used AFTER the drive) replaces
        // the latch-forever flag, so one route no longer makes every later report claim a live route;
        // NavSeen now carries the age and distinguishes yes / parse-fail / stale / no / notif-access-off.
        // (e) onListenerConnected replays already-posted nav notifications, so a mid-route rebind
        // resumes the HUD instead of looking like "no route running".
        // (f) HUD-only answers are cleared when leaving the HUD category (they leaked onto unrelated
        // reports via Back), and the report now records only DashCast's OWN notification grant as a
        // boolean rather than uploading the driver's full list of notification-reading apps.
        // No daemon protocol change; no CAN or HUD rendering change. +1 string x13 locales.)
        // 586 = 1.6.145-beta (CarPlay diag tool fix. The "fullscreen" button wrote
        // policy_control="immersive.full=<pkg>", but that is a single global string the head unit's
        // OEM "hide bars" toggle also owns as immersive.full=* — scoping it to one package narrowed
        // the wildcard and made the status/navigation bars reappear for every other window while
        // CarPlay still did not go fullscreen. It now hides the bars for ALL apps via the same
        // immersive.full=* wildcard the OEM uses, and skips the write entirely when policy_control is
        // already global-immersive (isOemGlobalImmersive) — no more clobbering; the prior value is
        // still saved and Restore reverts it. Adds a read-only "Dump state" button (settings/dumpsys
        // only, no wm verb, so it trips neither the display-0 guard nor the DL2 resize guard) that
        // reports display-0 geometry, the focused CarPlay window, bar visibility and the AutoKit
        // layer's activeBuffer/crop — revealing whether remaining black bands are the adapter's fixed
        // render, which policy_control cannot change. Diag-only; no daemon protocol change; DL3/DL5
        // unaffected. 1.6.144 shipped with the clobbering version because this fix was committed
        // after that release was built.)
        // 587 = 1.6.146-beta (INC-20260718-220538 lifecycle hardening. MirrorDaemon startup now
        // reuses a live ServiceManager Binder only when one daemon process and its PID-bound build
        // marker prove it came from this APK; stale OTA daemons, missing markers, duplicate PIDs,
        // dead binders, and broadcast-only ROMs retain the conservative kill/relaunch fallback.
        // The reuse check uses bounded dadb shell reads, never a blocking remote Binder transact.
        // Restarting projection after stopProjectionNoAdb now re-arms ClusterService through a
        // foreground start action, so a later Activity unbind cannot destroy an active projection.
        // Existing DL3 single-OS, boot auto-launch, fission, DL4, and DL5 guards are preserved.)
        versionCode 587
        versionName "1.6.146-beta"

        // Ship only the locales the app actually translates (verified against
        // res/values-*: 12 + base en). Strips ~58 dead AndroidX/Material locale
        // folders from resources.arsc — smaller APK for the bandwidth-limited
        // on-car OTA. Perf audit 2026-07-05 finding #16.
        resConfigs 'ar', 'be', 'de', 'en', 'es', 'it', 'kk', 'pl', 'ru', 'tr', 'uk', 'uz'

        // Bug-report bot credentials (see note at top of file).
        buildConfigField "String", "BUG_REPORT_BOT_TOKEN",
                "\"${_localProps.getProperty('bugReport.botToken', '')}\""
        buildConfigField "String", "BUG_REPORT_CHAT_ID",
                "\"${_localProps.getProperty('bugReport.chatId', '')}\""
        buildConfigField "String", "BUG_REPORT_THREAD_ID",
                "\"${_localProps.getProperty('bugReport.threadId', '')}\""

        // ONNX Runtime ships pre-built .so for x86, x86_64, armeabi-v7a,
        // arm64-v8a. DiLink hardware is exclusively ARM, so restrict to
        // those two ABIs to keep the APK from ballooning to 60 MB.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            // Platform signature is mandatory even in debug builds for BYD permissions
            signingConfig signingConfigs.bydPlatform
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.bydPlatform
        }
    }

    // AGP 8 : BuildConfig n'est plus généré par défaut — requis par 7 classes
    // (ProxyDaemonMain, ProxyClient, ClusterService, UpdateChecker, Settings,
    // Welcome, DiagActivity).
    buildFeatures {
        buildConfig true
    }

    // Ignore les erreurs de lint sur les permissions BYD non connues du SDK standard
    // (AGP 8 : bloc `lint` — l'ancien `lintOptions` a été supprimé)
    lint {
        abortOnError false
    }

    packagingOptions {
        // AGP 8 : remplace android:extractNativeLibs="false" du manifest
        // (même comportement : .so non compressés, chargés depuis l'APK).
        jniLibs {
            useLegacyPackaging = false
        }
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/*.kotlin_module'
        // v1.3.32-beta — voice native libs excluded from APK (~44 MB saved).
        // Downloaded on demand by VoiceLibsManager when voice is first enabled.
        // See scripts/prepare_voice_libs.sh to produce the zip for hosting.
        exclude '**/libonnxruntime.so'
        exclude '**/libonnxruntime4j_jni.so'
        exclude '**/libvosk.so'
        exclude '**/libjnidispatch.so'
    }

    // Java 17 unlocked by AGP 8 (D8 desugars records & co down to API 28).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin migration — must match compileOptions (Java 17) so mixed
    // Java/Kotlin compilation stays consistent during the transition.
    kotlinOptions {
        jvmTarget = '17'
    }


    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "DashCast-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

    // No resolutionStrategy.force needed with these API-29-compatible versions.

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    // Android 10 era versions (API 29) — minCompileSdk ≤ 29
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Material Components (Material 3) — fournit Theme.Material3.*
    // 1.9.0 = dernière version compatible compileSdk 33.
    implementation 'com.google.android.material:material:1.9.0'

    // dadb — pure-JVM ADB client (same library used by Overdrive)
    implementation 'dev.mobile:dadb:2.0.0'

    // v1.2.43-beta — used by the voice PoC (VoiceService → DiagActivity).
    // In-process broadcast only, no system-wide IPC, no extra permissions.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'

    // v1.2.50-beta — ONNX Runtime for openWakeWord wake-word detection.
    // Scope strictly limited to the Diag Voice tab (com.byd.dashcast.voice.wakeword.*).
    // The library ships native .so for several ABIs; we restrict to arm64+armv7
    // (the only ABIs DiLink 3/4/5 ever run on) via android.defaultConfig.ndk.abiFilters
    // to keep the APK growth under control. The runtime is initialised lazily —
    // production paths never reach this code unless the user toggles the wake-word
    // switch in the Diagnostic tab.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
    // v1.4.0 — Vosk offline speech recognition (post-wake transcription).
    // Small FR model (~40 MB) downloaded on first use via StorageService.unpack().
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // v1.4.2 — Encrypted storage for OpenAI API key
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
