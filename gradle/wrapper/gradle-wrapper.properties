distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-all.zip
# AUD-022 — anchor the distribution. Without this line the build downloads ~200 MB over the network
# and runs it unverified; with it, a substituted archive fails the wrapper instead of compiling.
#
# 9.7.1 is the CURRENT Gradle release: services.gradle.org/versions/current reports
# {"version":"9.7.1","current":true,"snapshot":false,"broken":false}, so this is the ceiling.
# (An earlier version of this note argued for staying on 9.5.0 because AGP 8.x could not run on
# Gradle >= 9.6. That constraint died with the move to AGP 9.4.0 and no longer applies.)
#
# The pin below is now corroborated THREE ways, replacing the earlier "single-source pin, stated
# plainly" caveat: the checksum Gradle publishes at
# https://services.gradle.org/distributions/gradle-9.7.1-all.zip.sha256, a sha256sum of this
# machine's own cached copy under ~/.gradle/wrapper/dists/gradle-9.7.1-all/, and this line.
# All three read 92c1a136d76b5017732a66d2e0a648ebff00dd3687d8bff0d0047a1bd904fdf2.
distributionSha256Sum=92c1a136d76b5017732a66d2e0a648ebff00dd3687d8bff0d0047a1bd904fdf2
