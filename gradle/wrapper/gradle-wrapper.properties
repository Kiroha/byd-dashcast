# AUD-022 — anchor the distribution. Without this line the build downloads ~200 MB over the network
# and runs it unverified; with it, a substituted archive fails the wrapper instead of compiling.
# Source for this value: the checksum Gradle publishes at
# https://services.gradle.org/distributions/gradle-9.5.0-all.zip.sha256
# NOTE: unlike the 8.14.5 pin, this could NOT be cross-checked against a local cache copy — this
# machine's cache holds gradle-9.5.0-bin, not -all. Single-source pin, stated plainly.
# 9.5.0 is deliberate, not arbitrary: it is the highest Gradle that KGP 2.4.x declares as fully
# supported (window 7.6.3-9.5.0). Gradle >= 9.6 removed internal Problems API classes that AGP 8.x
# binds to, so AGP 8.13.2 cannot run on it at all — that jump must be coupled with AGP 9.
distributionSha256Sum=a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439
