// Top-level build file for DashCast
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13.2 (last 8.x) + Gradle 8.14.5 + Kotlin 2.4.0 — all inside
        // KGP 2.4.0's tested window (Gradle 7.6.3-9.5.0, AGP 8.5.2-9.1.0).
        // AGP 9.x is a separate migration (old variant API removed, built-in
        // Kotlin, Build Tools 36) — see docs/KOTLIN_MIGRATION_AUDIT.md.
        // Requires a full JDK 17 (jlink).
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
