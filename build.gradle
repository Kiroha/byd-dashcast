// Top-level build file for DashCast
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.10.1 + Gradle 8.11.1 — the highest pair inside Kotlin 2.2.0's
        // tested support window (KGP 2.2.0 covers AGP up to 8.10). Requires a
        // full JDK 17 (jlink) — see docs/KOTLIN_MIGRATION_AUDIT.md.
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
