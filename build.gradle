// Top-level build file for DashCast
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        // Kotlin migration (branch switch-kotlin) — 2.2.0 (K2 compiler) is the
        // newest Kotlin; its support window (Gradle 7.6.3+, AGP 7.3.1+) still
        // covers our AGP 7.4.2 + Gradle 7.6.4, so no AGP bump is needed.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
